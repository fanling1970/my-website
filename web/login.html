<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>秋风小站 · 登录</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;background:linear-gradient(160deg,#0b2a3d 0%,#0d3a52 60%,#0e4a63 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .login-box{background:#fff;border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.28);width:340px;padding:36px 34px 26px;text-align:center}
  .logo{width:52px;height:52px;border-radius:12px;background:#0d4a63;color:#fff;font-size:26px;font-weight:700;display:flex;align-items:center;justify-content:center;margin:0 auto 12px}
  h1{font-size:22px;color:#12344d;margin-bottom:4px}
  .sub{font-size:13px;color:#8aa0b0;margin-bottom:26px}
  input{width:100%;padding:11px 14px;border:1px solid #d7e0e6;border-radius:8px;font-size:14px;margin-bottom:12px;outline:none;transition:border-color .15s}
  input:focus{border-color:#0d4a63}
  .err{color:#d33;font-size:13px;margin:4px 0 12px;display:none}
  button{width:100%;padding:12px;background:#0d4a63;color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;margin-top:6px}
  button:hover{background:#0b3d52}
  button:disabled{opacity:.6;cursor:wait}
  .back{display:inline-block;margin-top:18px;font-size:13px;color:#8aa0b0;text-decoration:none}
  .back:hover{color:#0d4a63}
  #cf{display:none}
</style>
</head>
<body>
  <form class="login-box" method="post" autocomplete="off">
    <div class="logo">秋</div>
    <h1>秋风小站</h1>
    <p class="sub" id="sub">管理后台登录</p>
    <!-- 字段名先随机化，防止浏览器自动填充；提交时恢复为标准名 -->
    <input type="text" id="u" name="l_u_9x" placeholder="用户名" autocomplete="off" required>
    <input type="text" id="p" name="l_p_7k" placeholder="密码" autocomplete="off" style="-webkit-text-security:disc" required>
    <input type="text" id="cf" name="l_c_4m" placeholder="再次输入密码" autocomplete="off" style="-webkit-text-security:disc">
    <p class="err" id="err">操作失败，请重试</p>
    <button type="submit" id="btn">登 录</button>
    <a class="back" href="/">← 返回首页</a>
  </form>
  <script>
    (function(){
      var form = document.querySelector('.login-box');
      var u = document.getElementById('u');
      var p = document.getElementById('p');
      var cf = document.getElementById('cf');
      var err = document.getElementById('err');
      var btn = document.getElementById('btn');
      var sub = document.getElementById('sub');
      var mode = 'login'; // login | register
      function showErr(msg){
        err.textContent = msg || '操作失败，请重试';
        err.style.display = 'block';
      }
      // 检测是否已注册：未注册显示注册表单
      fetch('/api/auth-status').then(function(r){ return r.json(); }).then(function(d){
        if (!d.registered){
          mode = 'register';
          sub.textContent = '首次使用，请注册管理员账号';
          cf.style.display = 'block';
          btn.textContent = '注册并进入';
        }
      });
      form.addEventListener('submit', function(e){
        e.preventDefault();
        err.style.display = 'none';
        var endpoint = mode === 'register' ? '/api/register' : '/api/login';
        u.name = 'username';
        p.name = 'password';
        cf.name = 'confirm';
        btn.disabled = true;
        btn.textContent = '请稍候…';
        fetch(endpoint, { method: 'POST', body: new FormData(form) }).then(function(r){
          return r.json();
        }).then(function(d){
          btn.disabled = false;
          btn.textContent = mode === 'register' ? '注册并进入' : '登 录';
          if (d.ok){
            location.replace('/admin');
          } else if (d.needRegister){
            mode = 'register';
            sub.textContent = '首次使用，请注册管理员账号';
            cf.style.display = 'block';
            btn.textContent = '注册并进入';
            showErr('还没有账号，请先注册');
          } else {
            showErr(d.err || '用户名或密码错误，请重试');
          }
        }).catch(function(){
          btn.disabled = false;
          btn.textContent = mode === 'register' ? '注册并进入' : '登 录';
          showErr('网络错误，请重试');
        });
      });
    })();
  </script>
</body>
</html>
