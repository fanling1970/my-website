<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>秋风小站</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231b4a6b'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%2346c8d8' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='2.5' fill='%23e8890c'/%3E%3C/svg%3E">
<style>
:root{--bg:#eef3f7;--card:#fff;--line:#d7e1ea;--ink:#1f2d3a;--ink2:#52606d;--ink3:#7b8794;--brand:#1b4a6b;--brand2:#0e8aa8;--accent:#e8890c}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Microsoft YaHei","PingFang SC","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.7}
a{color:inherit;text-decoration:none}
.topbar{background:var(--brand);color:#fff;padding:0 20px}
.topbar-inner{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:14px;min-height:58px}
.logo{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:700;cursor:pointer}
.logo .dot{width:12px;height:12px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px rgba(255,255,255,.15)}
.admin-link{margin-left:auto;font-size:13px;color:#9db8cc}
.admin-link:hover{color:#fff}
main{max-width:1200px;margin:0 auto;padding:24px 20px 40px}
.crumb{font-size:13px;color:var(--ink2);margin-bottom:16px;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.crumb a{color:var(--brand2);font-weight:600}
.crumb a:hover{text-decoration:underline}
.crumb .sep{color:var(--ink3)}
.list-head{font-size:22px;font-weight:700;margin-bottom:16px}
.node-list{list-style:none;display:flex;flex-direction:column;gap:10px}
.node-card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:15px 18px;display:flex;align-items:center;gap:14px;cursor:pointer;transition:border-color .15s}
.node-card:hover{border-color:var(--brand2)}
.node-card .ico{width:38px;height:38px;flex:none;border-radius:9px;display:flex;align-items:center;justify-content:center}
.node-card .ico.folder{background:#e7f0f7;color:var(--brand)}
.node-card .ico.page{background:#e3f1f6;color:var(--brand2)}
.node-card .ico.file{background:#fdeedd;color:var(--accent)}
.node-card .ico svg{width:20px;height:20px}
.node-card .tt{font-size:15px;font-weight:700}
.node-card .ds{font-size:12px;color:var(--ink3);margin-top:2px}
.node-card .act{margin-left:auto;flex:none}
.dl-btn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border-radius:8px;background:var(--brand2);color:#fff;font-size:13px;font-weight:600}
.dl-btn svg{width:14px;height:14px}
.article{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:36px 44px}
.article h1{font-size:26px;font-weight:700;line-height:1.4;margin-bottom:10px}
.article .meta{font-size:13px;color:var(--ink3);padding-bottom:16px;border-bottom:1px solid var(--line);margin-bottom:22px}
.article h2{font-size:19px;font-weight:700;margin:26px 0 10px;padding-left:12px;border-left:4px solid var(--brand2)}
.article h3{font-size:16px;font-weight:700;margin:20px 0 8px}
.article p{margin-bottom:14px;font-size:15px}
.article a{color:var(--brand2);font-weight:600}
.article a:hover{text-decoration:underline}
.article img{max-width:100%;border-radius:8px}
.article ul,.article ol{margin:0 0 14px 24px;font-size:15px}
.article li{margin-bottom:6px}
.article blockquote{border-left:4px solid var(--line);padding:6px 16px;margin:14px 0;color:var(--ink2);background:#f6f9fc;border-radius:0 8px 8px 0}
.article code{background:#eef2f6;padding:2px 7px;border-radius:5px;font-size:14px;font-family:Consolas,Menlo,monospace}
.article pre{background:#1f2d3a;color:#e8f0f8;padding:16px;border-radius:8px;overflow-x:auto;margin:14px 0;font-size:13px;font-family:Consolas,Menlo,monospace;line-height:1.6}
.article table{border-collapse:collapse;width:100%;margin:14px 0}
.article th,.article td{border:1px solid var(--line);padding:8px 12px;text-align:left;font-size:14px}
.article th{background:#f6f9fc}
/* 链接框卡片（后台"链接框"菜单插入的 标题+介绍+打开链接 结构，前台识别渲染成卡片）
   连续插入的同类卡片自动并排：中号一行3个、小号一行4个、大号铺满整行 */
.article .lnk-grid{display:grid;gap:12px;margin:10px 0}
.article .lnk-grid.md{grid-template-columns:repeat(3,minmax(0,1fr))}
.article .lnk-grid.sm{grid-template-columns:repeat(4,minmax(0,1fr))}
.article .lnk-card{display:flex;flex-direction:column;width:100%;border:1px solid var(--line);border-radius:10px;background:#f6f9fc;padding:14px 16px;box-sizing:border-box;margin:10px 0;transition:border-color .2s,box-shadow .2s}
.article .lnk-card:hover{border-color:var(--brand2);box-shadow:0 4px 14px rgba(9,105,218,.18)}
.article .lnk-card.lnk-effect-shake:hover{animation:lnk-shake .35s}
.article .lnk-card.lnk-effect-scale:hover{transform:scale(1.03);transition:transform .2s}
.article .lnk-card.lnk-effect-glow:hover{box-shadow:0 0 0 2px rgba(14,138,168,.25),0 0 20px rgba(14,138,168,.18)}
.article .lnk-card.lnk-effect-highlight:hover{border-color:var(--brand2);box-shadow:0 0 0 2px rgba(14,138,168,.2),0 4px 14px rgba(9,105,218,.15)}
@keyframes lnk-shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-3px)}40%{transform:translateX(3px)}60%{transform:translateX(-2px)}80%{transform:translateX(2px)}}
.article .lnk-grid .lnk-card{margin:0}
.article .lnk-card.lg{width:100%}
.article .lnk-card h2,.article .lnk-card h3,.article .lnk-card h5{margin:0;padding:0;border:none;color:var(--ink)}
.article .lnk-card h2{font-size:17px}
.article .lnk-card h3{font-size:16px}
.article .lnk-card h5{font-size:14px}
.article .lnk-card>p:first-of-type{margin:5px 0 0;font-size:13px;color:var(--ink3);flex:1}
.article .lnk-card>p:last-child{margin:9px 0 0}
.article .lnk-card>p:last-child a{display:inline-block;padding:5px 14px;background:var(--brand2);color:#fff;border-radius:6px;text-decoration:none;font-size:13px;font-weight:600}
.article .lnk-card>p:last-child a:hover{opacity:.9;text-decoration:none}
@media (max-width:760px){
  .article .lnk-grid.md{grid-template-columns:repeat(2,minmax(0,1fr))}
  .article .lnk-grid.sm{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:480px){
  .article .lnk-grid.md,.article .lnk-grid.sm{grid-template-columns:minmax(0,1fr)}
}
.back{margin-top:24px;font-size:13px}
.back a{color:var(--brand2);font-weight:600}
.empty{padding:60px 20px;text-align:center;color:var(--ink3);font-size:15px}
footer{max-width:900px;margin:0 auto;padding:0 20px 26px;font-size:12px;color:var(--ink3)}
@media (max-width:560px){.article{padding:22px 18px}.article h1{font-size:21px}}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="logo" id="logo"><span class="dot"></span>秋风小站</div>
    <a class="admin-link" href="/admin">管理 →</a>
  </div>
</header>
<main id="main"></main>
<footer>秋风小站 · 基于 LAN-CMS</footer>

<script>
(function(){
  var main = document.getElementById('main');
  var allNodes = [];
  var ICON = {
    folder: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>',
    page: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>',
    file: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M13 2v7h7"/></svg>',
    dl: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v12M6 9l6 6 6-6"/><path d="M4 19h16"/></svg>'
  };

  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function fmt(t){ try{ return new Date(t).toLocaleString('zh-CN',{hour12:false}); }catch(e){ return ''; } }
  function fmtSize(b){
    if (!b) return '';
    if (b < 1024) return b + ' B';
    if (b < 1048576) return (b/1024).toFixed(1) + ' KB';
    if (b < 1073741824) return (b/1048576).toFixed(1) + ' MB';
    return (b/1073741824).toFixed(2) + ' GB';
  }
  function findNode(id){ for (var i=0;i<allNodes.length;i++){ if (allNodes[i].id===id) return allNodes[i]; } return null; }
  function childrenOf(id){ return allNodes.filter(function(n){ return n.parent === id; }); }
  function sortKids(list){ return list.slice().sort(function(a,b){ return a.type==='folder' && b.type!=='folder' ? -1 : (a.type!=='folder' && b.type==='folder' ? 1 : (a.title < b.title ? -1 : 1)); }); }

  // 面包屑（从根到当前节点路径）
  function breadcrumb(id){
    var parts = [];
    var cur = id ? findNode(id) : null;
    while (cur){
      parts.unshift({ id: cur.id, title: cur.title });
      cur = cur.parent ? findNode(cur.parent) : null;
    }
    var html = '<a href="/">首页</a>';
    parts.forEach(function(p){
      html += '<span class="sep"> / </span><a href="/?f=' + p.id + '">' + esc(p.title) + '</a>';
    });
    return '<div class="crumb">' + html + '</div>';
  }

  function renderFolder(fid){
    var folder = fid ? findNode(fid) : null;
    if (fid && !folder){ main.innerHTML = '<div class="empty">文件夹不存在或已删除</div>'; return; }
    var kids = sortKids(childrenOf(fid || ''));
    if (!fid){ kids = kids.filter(function(n){ return n.type !== 'folder'; }); }  // 首页隐藏文件夹，只显示页面
    if (!kids.length){
      main.innerHTML = breadcrumb(fid) + '<div class="empty">这里还没有内容</div>';
      return;
    }
    var html = breadcrumb(fid) + '<div class="list-head">' + esc(folder ? folder.title : '全部内容') + '</div><ul class="node-list">';
    kids.forEach(function(n){
      var icon = n.type==='folder' ? ICON.folder : (n.type==='file' ? ICON.file : ICON.page);
      var cls = n.type==='folder' ? 'folder' : (n.type==='file' ? 'file' : 'page');
      var ds = n.type==='folder' ? childrenOf(n.id).length + ' 项' : (n.type==='file' ? fmtSize(n.size) : '更新于 ' + fmt(n.updatedAt));
      html += '<li class="node-card" data-type="' + n.type + '" data-id="' + n.id + '" data-url="' + esc(n.content||'') + '">'
        + '<span class="ico ' + cls + '">' + icon + '</span>'
        + '<span class="tt">' + esc(n.title) + '</span>'
        + '<span class="ds">' + ds + '</span>'
        + '</li>';
    });
    html += '</ul>';
    main.innerHTML = html;
    Array.prototype.forEach.call(main.querySelectorAll('.node-card'), function(c){
      var type = c.getAttribute('data-type');
      var id = c.getAttribute('data-id');
      var url = c.getAttribute('data-url');
      c.onclick = function(){
        if (type === 'folder') location.href = '/?f=' + id;
        else if (type === 'file'){ var a = document.createElement('a'); a.href = url; a.download = ''; document.body.appendChild(a); a.click(); a.remove(); }
        else location.href = '/?p=' + id;
      };
    });
  }

  function renderPage(pid){
    fetch(location.protocol + '//' + location.host + '/api/nodes/' + pid).then(function(r){
      if (r.status === 401){
        // 仅登录可见页面：未登录访问时提示登录
        main.innerHTML = '<div class="empty">该页面需要登录后才能查看</div>'
          + '<div class="back" style="text-align:center"><a class="fbtn" href="/login">前往登录 →</a></div>';
        return null;
      }
      return r.json();
    }).then(function(n){
      if (!n) return;
      if (n.error){ main.innerHTML = '<div class="empty">内容不存在或已删除</div>'; return; }
      main.innerHTML = '<div class="crumb"><a href="/">← 返回列表</a></div>'
        + '<article class="article"><h1>' + esc(n.title) + '</h1>'
        + '<div class="meta">更新于 ' + fmt(n.updatedAt) + '</div>'
        + '<div class="content">' + n.content + '</div></article>'
        + '<div class="back"><a href="/">← 返回列表</a></div>';
      cardify();
    });
  }

  // 链接框卡片化：把「标题(h2/h3/h5) + 介绍段 + 打开链接段」识别为卡片；
  // 连续插入的同类卡片（中间无其他内容隔开）自动并排：中号一行3个、小号一行4个、大号铺满整行
  function cardify(){
    var c = document.querySelector('.article .content');
    if (!c) return;
    // 先拆包：移除可能已存在的 lnk-grid / lnk-card wrapper（避免重复包装）
    var wrappers = c.querySelectorAll('.lnk-grid, .lnk-card');
    for (var wi = wrappers.length - 1; wi >= 0; wi--){
      var w = wrappers[wi];
      var parent = w.parentNode;
      while (w.firstChild) parent.insertBefore(w.firstChild, w);
      w.parentNode.removeChild(w);
    }
    var kids = Array.prototype.slice.call(c.children);
    var items = [];
    var i = 0;
    while (i < kids.length){
      var el = kids[i];
      if (/^H[235]$/.test(el.tagName)){
        var s1 = el.nextElementSibling, s2 = s1 && s1.nextElementSibling;
        if (s1 && s1.tagName === 'P' && s2 && s2.tagName === 'P' && s2.querySelector('a')){
          items.push({ h: el, s1: s1, s2: s2, size: el.tagName });
          i += 3; // 跳过卡片的 标题+介绍+链接 三块
          continue;
        }
      }
      // 空段落（<p><br></p> 或空白）是编辑器自动产生的换行，不打断卡片组
      if (el.tagName === 'P' && (el.innerHTML === '<br>' || (el.textContent || '').trim() === '')){ i++; continue; }
      items.push(null); // 其他内容（分类标题/正文等）打断卡片组
      i++;
    }
    var groups = [], cur = null;
    items.forEach(function(it){
      if (!it){ cur = null; return; }
      if (!cur || cur.size !== it.size){ cur = { size: it.size, items: [it] }; groups.push(cur); }
      else { cur.items.push(it); }
    });
    // 推断默认动作：旧数据没有 data-action 时，根据链接类型猜测
    function guessAction(a){
      var href = (a.getAttribute('href') || '').toLowerCase();
      if (href.match(/\.(zip|rar|7z|tar|gz|apk|ipa|exe|msi|dmg|iso|pdf|doc|docx|xls|xlsx|ppt|pptx|mp3|mp4|mov|avi|mkv|flac|wav|psd|ai|sketch|fig)$/)) return '下载';
      if (href.startsWith('/files/')) return '下载';
      return '打开';
    }
    function wrapCard(it, size, grid){
      var w = document.createElement('div');
      it.h.parentNode.insertBefore(w, it.h);
      w.appendChild(it.h); w.appendChild(it.s1); w.appendChild(it.s2);
      if (grid) grid.appendChild(w);
      // 确保按钮文字与 data-action 一致（智能补全旧数据）
      var a = it.s2.querySelector('a');
      var effect = 'none';
      if (a){
        var act = a.getAttribute('data-action');
        if (!act){ act = guessAction(a); a.setAttribute('data-action', act); }
        a.textContent = act + ' →';
        var ef = a.getAttribute('data-effect');
        if (ef){ effect = ef; } // 旧数据没有 data-effect，保持 none
      }
      w.className = 'lnk-card ' + size + ' lnk-effect-' + effect;
      return w;
    }
    groups.forEach(function(g){
      if (g.size === 'H2'){ g.items.forEach(function(it){ wrapCard(it, 'lg', null); }); return; }
      var size = g.size === 'H5' ? 'sm' : 'md';
      var grid = document.createElement('div');
      grid.className = 'lnk-grid ' + size;
      g.items[0].h.parentNode.insertBefore(grid, g.items[0].h);
      g.items.forEach(function(it){ wrapCard(it, size, grid); });
    });
  }

  var params = new URLSearchParams(location.search);
  var pid = params.get('p');
  var fid = params.get('f');
  // 用不含登录信息的绝对地址请求数据（避免 URL 残留凭据时 fetch 报错）
  var apiBase = location.protocol + '//' + location.host;

  // 主题预设（与后端保持一致）
  var THEMES = [
    { key: 'cyan',   brand: '#1b4a6b', brand2: '#0e8aa8', accent: '#e8890c' },
    { key: 'blue',   brand: '#1a3c6e', brand2: '#2b7cff', accent: '#ff7a45' },
    { key: 'purple', brand: '#4b2d73', brand2: '#8a5cf6', accent: '#ffb84d' },
    { key: 'green',  brand: '#1f5e3a', brand2: '#2ba86f', accent: '#f08c00' },
    { key: 'pink',   brand: '#6a1b4b', brand2: '#d43f7c', accent: '#ffc400' },
    { key: 'dark',   brand: '#111111', brand2: '#444444', accent: '#999999' }
  ];
  function applySettings(s){
    if (!s) return;
    var name = s.siteName || '秋风小站';
    document.getElementById('logo').innerHTML = '<span class="dot"></span>' + esc(name);
    document.title = name;
    var footer = document.querySelector('footer');
    if (footer) footer.textContent = name + ' · 基于 LAN-CMS';
    var p = THEMES.find(function(t){ return t.key === s.theme; }) || THEMES[0];
    var r = document.documentElement.style;
    r.setProperty('--brand', p.brand);
    r.setProperty('--brand2', p.brand2);
    r.setProperty('--accent', p.accent);
  }

  fetch(apiBase + '/api/settings').then(function(r){ return r.json(); }).then(applySettings).catch(function(){});

  fetch(apiBase + '/api/nodes').then(function(r){ return r.json(); }).then(function(list){
    allNodes = list;
    if (pid){ renderPage(pid); }
    else { renderFolder(fid || ''); }
  });

  document.getElementById('logo').onclick = function(){ location.href = '/'; };
})();
</script>
</body>
</html>
