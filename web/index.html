<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>秋风小站</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231b4a6b'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%2346c8d8' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='2.5' fill='%23e8890c'/%3E%3C/svg%3E">
<style>
:root{--bg:#eef3f7;--card:#fff;--line:#d7e1ea;--ink:#1f2d3a;--ink2:#52606d;--ink3:#7b8794;--brand:#1b4a6b;--brand2:#0e8aa8;--accent:#e8890c}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Microsoft YaHei","PingFang SC","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.7}
a{color:inherit;text-decoration:none}
.topbar{background:var(--brand);color:#fff;padding:0 20px}
.topbar-inner{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:14px;min-height:58px}
.logo{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:700;cursor:pointer}
.logo .dot{width:12px;height:12px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px rgba(255,255,255,.15)}
.admin-link{margin-left:auto;font-size:13px;color:#9db8cc}
.admin-link:hover{color:#fff}
main{max-width:1200px;margin:0 auto;padding:24px 20px 40px}
.crumb{font-size:13px;color:var(--ink2);margin-bottom:16px;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.crumb a{color:var(--brand2);font-weight:600}
.crumb a:hover{text-decoration:underline}
.crumb .sep{color:var(--ink3)}
.list-head{font-size:22px;font-weight:700;margin-bottom:16px}
.node-list{list-style:none;display:flex;flex-direction:column;gap:10px}
.node-card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:15px 18px;display:flex;align-items:center;gap:14px;cursor:pointer;transition:border-color .15s}
.node-card:hover{border-color:var(--brand2)}
.node-card .ico{width:38px;height:38px;flex:none;border-radius:9px;display:flex;align-items:center;justify-content:center}
.node-card .ico.folder{background:#e7f0f7;color:var(--brand)}
.node-card .ico.page{background:#e3f1f6;color:var(--brand2)}
.node-card .ico.file{background:#fdeedd;color:var(--accent)}
.node-card .ico svg{width:20px;height:20px}
.node-card .tt{font-size:15px;font-weight:700}
.node-card .ds{font-size:12px;color:var(--ink3);margin-top:2px}
.node-card .act{margin-left:auto;flex:none}
.dl-btn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border-radius:8px;background:var(--brand2);color:#fff;font-size:13px;font-weight:600}
.dl-btn svg{width:14px;height:14px}
.article{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:36px 44px}
.article h1{font-size:26px;font-weight:700;line-height:1.4;margin-bottom:10px}
.article .meta{font-size:13px;color:var(--ink3);padding-bottom:16px;border-bottom:1px solid var(--line);margin-bottom:22px}
.article h2{font-size:19px;font-weight:700;margin:26px 0 10px;padding-left:12px;border-left:4px solid var(--brand2)}
.article h3{font-size:16px;font-weight:700;margin:20px 0 8px}
.article p{margin-bottom:14px;font-size:15px}
.article a{color:var(--brand2);font-weight:600}
.article a:hover{text-decoration:underline}
.article img{max-width:100%;border-radius:8px}
.article ul,.article ol{margin:0 0 14px 24px;font-size:15px}
.article li{margin-bottom:6px}
.article blockquote{border-left:4px solid var(--line);padding:6px 16px;margin:14px 0;color:var(--ink2);background:#f6f9fc;border-radius:0 8px 8px 0}
.article code{background:#eef2f6;padding:2px 7px;border-radius:5px;font-size:14px;font-family:Consolas,Menlo,monospace}
.article pre{background:#1f2d3a;color:#e8f0f8;padding:16px;border-radius:8px;overflow-x:auto;margin:14px 0;font-size:13px;font-family:Consolas,Menlo,monospace;line-height:1.6}
.article table{border-collapse:collapse;width:100%;margin:14px 0}
.article th,.article td{border:1px solid var(--line);padding:8px 12px;text-align:left;font-size:14px}
.article th{background:#f6f9fc}
/* 链接框卡片（后台"链接框"菜单插入的 标题+介绍+打开链接 结构，前台识别渲染成卡片）
   连续插入的同类卡片自动并排：中号一行3个、小号一行4个、大号铺满整行 */
.article .lnk-grid{display:grid;gap:12px;margin:10px 0}
.article .lnk-grid.md{grid-template-columns:repeat(3,minmax(0,1fr))}
.article .lnk-grid.sm{grid-template-columns:repeat(4,minmax(0,1fr))}
.article .lnk-card{display:flex;flex-direction:column;width:100%;border:1px solid var(--line);border-radius:10px;background:#f6f9fc;padding:14px 16px;box-sizing:border-box;margin:10px 0;transition:border-color .2s,box-shadow .2s,transform .2s}
/* 默认（无特效）不加任何 hover 效果；特效由 lnk-effect-xxx class 决定，可多选叠加 */
.article .lnk-card.lnk-effect-highlight:hover{border-color:var(--brand2);box-shadow:0 0 0 2px rgba(14,138,168,.2),0 4px 14px rgba(9,105,218,.12)}
.article .lnk-card.lnk-effect-shake:hover{animation:lnk-shake .35s}
.article .lnk-card.lnk-effect-scale:hover{transform:scale(1.03)}
.article .lnk-card.lnk-effect-glow:hover{box-shadow:0 0 0 2px rgba(14,138,168,.25),0 0 20px rgba(14,138,168,.18)}
@keyframes lnk-shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-3px)}40%{transform:translateX(3px)}60%{transform:translateX(-2px)}80%{transform:translateX(2px)}}
.article .lnk-grid .lnk-card{margin:0}
.article .lnk-card.lg{width:100%}
.article .lnk-card h2,.article .lnk-card h3,.article .lnk-card h5{margin:0;padding:0;border:none;color:var(--ink)}
.article .lnk-card h2{font-size:17px}
.article .lnk-card h3{font-size:16px}
.article .lnk-card h5{font-size:14px}
.article .lnk-card>p:first-of-type{margin:5px 0 0;font-size:13px;color:var(--ink3);flex:1}
.article .lnk-card>p:last-child{margin:9px 0 0}
.article .lnk-card>p:last-child a{display:inline-block;padding:5px 14px;background:var(--brand2);color:#fff;border-radius:6px;text-decoration:none;font-size:13px;font-weight:600}
.article .lnk-card>p:last-child a:hover{opacity:.9;text-decoration:none}
/* 文本框（代码块外观）*/
.article pre{position:relative;margin:16px 0;padding:20px 20px 20px 22px;border:1px solid #e3e8ee;border-radius:10px;background:#f7f9fb;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;line-height:1.7;color:#2b3440;overflow:auto;max-height:460px;white-space:pre-wrap;word-break:break-word}
.article pre code{font-family:inherit;font-size:inherit;background:transparent;padding:0;white-space:pre-wrap}
.article pre .pre-copy{position:absolute;top:10px;right:10px;padding:4px 12px;border:1px solid #dbe4ec;border-radius:6px;background:#fff;color:#2c3e50;font-size:12px;cursor:pointer;opacity:.55;transition:opacity .2s,background .2s}
.article pre:hover .pre-copy{opacity:1}
.article pre .pre-copy:hover{background:#eef6f9;color:var(--brand2)}
/* 视频（封面 + 大屏播放）*/
.article .vdo-wrap{position:relative;margin:16px 0;max-width:640px}
.article .vdo-wrap video{display:block;width:100%;border-radius:10px;background:#000;cursor:pointer}
.article .vdo-big{position:absolute;top:10px;right:10px;padding:5px 12px;border-radius:6px;background:rgba(17,24,32,.62);color:#fff;font-size:12px;text-decoration:none;backdrop-filter:blur(2px)}
.article .vdo-big:hover{background:var(--brand2);text-decoration:none}
.article .vdo-wrap iframe{display:block;width:100%;aspect-ratio:16/9;border:0;border-radius:10px;background:#000}
.article .mp-box{margin:16px 0;border:1px solid #e3eaf1;border-radius:10px;background:#fff;overflow:hidden}
.article .mp-head{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid #eef2f6;background:#fafcfd}
.article .mp-head .mp-all{display:flex;align-items:center;gap:6px;font-size:13px;color:#52606d;cursor:pointer}
.article .mp-head .mp-count{font-size:12px;color:#95a5b3}
.article .mp-head .mp-playsel{margin-left:auto;display:flex;align-items:center;gap:4px;border:none;border-radius:6px;background:#0e8aa8;color:#fff;font-size:13px;padding:6px 12px;cursor:pointer}
.article .mp-head .mp-playsel:hover{background:#0b7a95}
.article .mp-list{max-height:none}
.article .mp-list.scroll{max-height:440px;overflow-y:auto}
.article .mp-row{display:flex;align-items:center;gap:8px;padding:9px 14px;border-bottom:1px solid #f2f6f9;font-size:14px;cursor:pointer}
.article .mp-row:last-child{border-bottom:none}
.article .mp-row:hover{background:#f7fbfd}
.article .mp-row.playing{background:#f0f8fb}
.article .mp-row .mp-ck{display:flex;align-items:center;flex:none}
.article .mp-row .mp-idx{width:24px;flex:none;text-align:right;color:#e8890c;font-size:13px;font-variant-numeric:tabular-nums}
.article .mp-row .mp-title{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#2c3e50}
.article .mp-row.playing .mp-title{color:#0e8aa8;font-weight:600}
.article .mp-row .mp-acts{display:flex;align-items:center;gap:6px;flex:none}
.article .mp-row .mp-i{display:flex;align-items:center;justify-content:center;width:22px;height:22px;padding:0;border:none;background:none;color:#a9bccb;cursor:pointer}
.article .mp-row:hover .mp-i,.article .mp-row.playing .mp-i{color:#8fa4b5}
.article .mp-row .mp-i:hover{color:#0e8aa8}
.article .mp-row .mp-dur{width:44px;flex:none;text-align:right;color:#7a8a99;font-size:13px;font-variant-numeric:tabular-nums}
.article .mp-bar{border-top:1px solid #eef2f6;padding:6px 14px 10px;background:#fff}
.article .mp-prog{position:relative;height:16px;cursor:pointer}
.article .mp-prog-bg{position:absolute;left:0;right:0;top:7px;height:2px;border-radius:2px;background:#e8eef4}
.article .mp-prog-fill{position:absolute;left:0;top:7px;height:2px;border-radius:2px;background:#f0b429;width:0}
.article .mp-prog-dot{position:absolute;left:0;top:3px;width:10px;height:10px;border-radius:50%;background:#f0b429;transform:translateX(-50%)}
.article .mp-ctrl{display:flex;align-items:center;gap:10px}
.article .mp-now{font-size:14px;color:#2c3e50;max-width:40%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.article .mp-time{font-size:13px;color:#7a8a99;font-variant-numeric:tabular-nums}
.article .mp-ctrls{margin-left:auto;display:flex;align-items:center;gap:8px}
.article .mp-btn{display:flex;align-items:center;justify-content:center;padding:3px 4px;border:none;background:none;color:#4a6377;cursor:pointer}
.article .mp-btn:hover{color:#0e8aa8}
.article .mp-btn.active{color:#0e8aa8}
.article .mp-btn.mp-main{width:32px;height:32px;border:1px solid #d7e1ea;border-radius:50%}
.article .mp-btn.mp-main:hover{background:#f2f8fb}
.article .mp-vol{width:70px;height:4px;accent-color:#f0b429;cursor:pointer}
@media (max-width:520px){
  .article .mp-row .mp-i[data-act="open"]{display:none}
  .article .mp-vol{display:none}
  .article .mp-now{max-width:32%}
}
@media (max-width:760px){
  .article .lnk-grid.md{grid-template-columns:repeat(2,minmax(0,1fr))}
  .article .lnk-grid.sm{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:480px){
  .article .lnk-grid.md,.article .lnk-grid.sm{grid-template-columns:minmax(0,1fr)}
}
.back{margin-top:24px;font-size:13px}
.back a{color:var(--brand2);font-weight:600}
.empty{padding:60px 20px;text-align:center;color:var(--ink3);font-size:15px}
footer{max-width:900px;margin:0 auto;padding:0 20px 26px;font-size:12px;color:var(--ink3)}
@media (max-width:560px){.article{padding:22px 18px}.article h1{font-size:21px}}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="logo" id="logo"><span class="dot"></span>秋风小站</div>
    <a class="admin-link" href="/admin">管理 →</a>
  </div>
</header>
<main id="main"></main>
<footer>秋风小站 · 基于 LAN-CMS</footer>

<script>
(function(){
  var main = document.getElementById('main');
  var allNodes = [];
  var ICON = {
    folder: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>',
    page: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>',
    file: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M13 2v7h7"/></svg>',
    dl: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v12M6 9l6 6 6-6"/><path d="M4 19h16"/></svg>'
  };

  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function fmt(t){ try{ return new Date(t).toLocaleString('zh-CN',{hour12:false}); }catch(e){ return ''; } }
  function fmtSize(b){
    if (!b) return '';
    if (b < 1024) return b + ' B';
    if (b < 1048576) return (b/1024).toFixed(1) + ' KB';
    if (b < 1073741824) return (b/1048576).toFixed(1) + ' MB';
    return (b/1073741824).toFixed(2) + ' GB';
  }
  function findNode(id){ for (var i=0;i<allNodes.length;i++){ if (allNodes[i].id===id) return allNodes[i]; } return null; }
  function childrenOf(id){ return allNodes.filter(function(n){ return n.parent === id; }); }
  // 文件夹优先；组内按后台手动排序（order）升序，未调整过时按标题
  function sortKids(list){ return list.slice().sort(function(a,b){
    if (a.type==='folder' && b.type!=='folder') return -1;
    if (a.type!=='folder' && b.type==='folder') return 1;
    var ao = a.order || 0, bo = b.order || 0;
    if (ao !== bo) return ao - bo;
    return (a.title < b.title) ? -1 : (a.title > b.title ? 1 : 0);
  }); }

  // 面包屑（从根到当前节点路径）
  function breadcrumb(id){
    var parts = [];
    var cur = id ? findNode(id) : null;
    while (cur){
      parts.unshift({ id: cur.id, title: cur.title });
      cur = cur.parent ? findNode(cur.parent) : null;
    }
    var html = '<a href="/">首页</a>';
    parts.forEach(function(p){
      html += '<span class="sep"> / </span><a href="/?f=' + p.id + '">' + esc(p.title) + '</a>';
    });
    return '<div class="crumb">' + html + '</div>';
  }

  function renderFolder(fid){
    var folder = fid ? findNode(fid) : null;
    if (fid && !folder){ main.innerHTML = '<div class="empty">文件夹不存在或已删除</div>'; return; }
    var kids = sortKids(childrenOf(fid || ''));
    if (!fid){ kids = kids.filter(function(n){ return n.type !== 'folder'; }); }  // 首页隐藏文件夹，只显示页面
    if (!kids.length){
      main.innerHTML = breadcrumb(fid) + '<div class="empty">这里还没有内容</div>';
      return;
    }
    var html = breadcrumb(fid) + '<div class="list-head">' + esc(folder ? folder.title : '全部内容') + '</div><ul class="node-list">';
    kids.forEach(function(n){
      var icon = n.type==='folder' ? ICON.folder : (n.type==='file' ? ICON.file : ICON.page);
      var cls = n.type==='folder' ? 'folder' : (n.type==='file' ? 'file' : 'page');
      var ds = n.type==='folder' ? childrenOf(n.id).length + ' 项' : (n.type==='file' ? fmtSize(n.size) : '更新于 ' + fmt(n.updatedAt));
      html += '<li class="node-card" data-type="' + n.type + '" data-id="' + n.id + '" data-url="' + esc(n.content||'') + '">'
        + '<span class="ico ' + cls + '">' + icon + '</span>'
        + '<span class="tt">' + esc(n.title) + '</span>'
        + '<span class="ds">' + ds + '</span>'
        + '</li>';
    });
    html += '</ul>';
    main.innerHTML = html;
    Array.prototype.forEach.call(main.querySelectorAll('.node-card'), function(c){
      var type = c.getAttribute('data-type');
      var id = c.getAttribute('data-id');
      var url = c.getAttribute('data-url');
      c.onclick = function(){
        if (type === 'folder') location.href = '/?f=' + id;
        else if (type === 'file'){ var a = document.createElement('a'); a.href = url; a.download = ''; document.body.appendChild(a); a.click(); a.remove(); }
        else location.href = '/?p=' + id;
      };
    });
  }

  function renderPage(pid){
    fetch(location.protocol + '//' + location.host + '/api/nodes/' + pid).then(function(r){
      if (r.status === 401){
        // 仅登录可见页面：未登录访问时提示登录
        main.innerHTML = '<div class="empty">该页面需要登录后才能查看</div>'
          + '<div class="back" style="text-align:center"><a class="fbtn" href="/login">前往登录 →</a></div>';
        return null;
      }
      return r.json();
    }).then(function(n){
      if (!n) return;
      if (n.error){ main.innerHTML = '<div class="empty">内容不存在或已删除</div>'; return; }
      main.innerHTML = '<div class="crumb"><a href="/">← 返回列表</a></div>'
        + '<article class="article"><h1>' + esc(n.title) + '</h1>'
        + '<div class="meta">更新于 ' + fmt(n.updatedAt) + '</div>'
        + '<div class="content">' + n.content + '</div></article>'
        + '<div class="back"><a href="/">← 返回列表</a></div>';
      cardify();
    });
  }

  // 链接框卡片化：把「标题(h2/h3/h5) + 介绍段 + 打开链接段」识别为卡片；
  // 连续插入的同类卡片（中间无其他内容隔开）自动并排：中号一行3个、小号一行4个、大号铺满整行
  function cardify(){
    var c = document.querySelector('.article .content');
    if (!c) return;
    // 先拆包：移除可能已存在的 lnk-grid / lnk-card wrapper（避免重复包装）
    var wrappers = c.querySelectorAll('.lnk-grid, .lnk-card');
    for (var wi = wrappers.length - 1; wi >= 0; wi--){
      var w = wrappers[wi];
      var parent = w.parentNode;
      while (w.firstChild) parent.insertBefore(w.firstChild, w);
      w.parentNode.removeChild(w);
    }
    var kids = Array.prototype.slice.call(c.children);
    var items = [];
    var i = 0;
    while (i < kids.length){
      var el = kids[i];
      if (/^H[235]$/.test(el.tagName)){
        var s1 = el.nextElementSibling, s2 = s1 && s1.nextElementSibling;
        if (s1 && s1.tagName === 'P' && s2 && s2.tagName === 'P' && s2.querySelector('a')){
          items.push({ h: el, s1: s1, s2: s2, size: el.tagName });
          i += 3; // 跳过卡片的 标题+介绍+链接 三块
          continue;
        }
      }
      // 空段落（<p><br></p> 或空白）是编辑器自动产生的换行，不打断卡片组
      if (el.tagName === 'P' && (el.innerHTML === '<br>' || (el.textContent || '').trim() === '')){ i++; continue; }
      items.push(null); // 其他内容（分类标题/正文等）打断卡片组
      i++;
    }
    var groups = [], cur = null;
    items.forEach(function(it){
      if (!it){ cur = null; return; }
      if (!cur || cur.size !== it.size){ cur = { size: it.size, items: [it] }; groups.push(cur); }
      else { cur.items.push(it); }
    });
    // 推断默认动作：旧数据没有 data-action 时，根据链接类型猜测
    function guessAction(a){
      var href = (a.getAttribute('href') || '').toLowerCase();
      if (href.match(/\.(zip|rar|7z|tar|gz|apk|ipa|exe|msi|dmg|iso|pdf|doc|docx|xls|xlsx|ppt|pptx|mp3|mp4|mov|avi|mkv|flac|wav|psd|ai|sketch|fig)$/)) return '下载';
      if (href.startsWith('/files/')) return '下载';
      return '打开';
    }
    var FX_KEYS = ['highlight', 'shake', 'scale', 'glow'];
    function wrapCard(it, size, grid){
      var w = document.createElement('div');
      it.h.parentNode.insertBefore(w, it.h);
      w.appendChild(it.h); w.appendChild(it.s1); w.appendChild(it.s2);
      if (grid) grid.appendChild(w);
      // 确保按钮文字与 data-action 一致（智能补全旧数据）
      var a = it.s2.querySelector('a');
      var effects = [];
      if (a){
        var act = a.getAttribute('data-action');
        if (!act){ act = guessAction(a); a.setAttribute('data-action', act); }
        a.textContent = act + ' →';
        // 特效可多选，空格分隔；旧数据 default 无
        var ef = a.getAttribute('data-effect');
        if (ef) effects = ef.split(/\s+/).filter(function(x){ return FX_KEYS.indexOf(x) >= 0; });
      }
      var fxCls = effects.length ? ' ' + effects.map(function(e){ return 'lnk-effect-' + e; }).join(' ') : ' lnk-effect-none';
      w.className = 'lnk-card ' + size + fxCls;
      return w;
    }
    groups.forEach(function(g){
      if (g.size === 'H2'){ g.items.forEach(function(it){ wrapCard(it, 'lg', null); }); return; }
      var size = g.size === 'H5' ? 'sm' : 'md';
      var grid = document.createElement('div');
      grid.className = 'lnk-grid ' + size;
      g.items[0].h.parentNode.insertBefore(grid, g.items[0].h);
      g.items.forEach(function(it){ wrapCard(it, size, grid); });
    });
    decorateBlocks(c);
  }

  // ===== 音乐播放控件（歌曲列表 + 控制栏 + 顺序/列表循环/随机/单曲循环）=====
  var MP_ICON = {
    play: '<svg viewBox="0 0 24 24" fill="currentColor" width="15" height="15"><path d="M8 5v14l11-7z"/></svg>',
    pause: '<svg viewBox="0 0 24 24" fill="currentColor" width="15" height="15"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>',
    prev: '<svg viewBox="0 0 24 24" fill="currentColor" width="15" height="15"><path d="M7 5h2v14H7zM18 5v14L9.5 12z"/></svg>',
    next: '<svg viewBox="0 0 24 24" fill="currentColor" width="15" height="15"><path d="M15 5h2v14h-2zM6 5v14L14.5 12z"/></svg>',
    dl: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15"><path d="M12 4v10M8 10l4 4 4-4M5 20h14"/></svg>',
    open: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15"><path d="M14 4h6v6M20 4l-9 9"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>',
    volOn: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></svg>',
    volOff: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9.5l4.5 5M21.5 9.5l-4.5 5"/></svg>',
    modeOrder: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M3 7h14l-3.5-3.5M21 17H7l3.5 3.5"/></svg>',
    modeLoop: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M17 2.5l3.5 3.5-3.5 3.5"/><path d="M4 11V9.5A3.5 3.5 0 0 1 7.5 6H20"/><path d="M7 21.5L3.5 18 7 14.5"/><path d="M20 13v1.5a3.5 3.5 0 0 1-3.5 3.5H4"/></svg>',
    modeShuffle: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M16 3h5v5M21 3l-7 7M8 21H3v-5M3 21l7-7M21 16v5h-5M14 14l7 7M3 3l7 7"/></svg>',
    modeSingle: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M17 2.5l3.5 3.5-3.5 3.5"/><path d="M4 11V9.5A3.5 3.5 0 0 1 7.5 6H20"/><path d="M7 21.5L3.5 18 7 14.5"/><path d="M20 13v1.5a3.5 3.5 0 0 1-3.5 3.5H4"/><text x="8.6" y="15.4" font-size="8" fill="currentColor" stroke="none">1</text></svg>'
  };
  var MP_MODES = [
    { icon: 'modeOrder',   tip: '顺序播放' },
    { icon: 'modeLoop',    tip: '列表循环' },
    { icon: 'modeShuffle', tip: '随机播放' },
    { icon: 'modeSingle',  tip: '单曲循环' }
  ];
  var mpPlayers = [];
  function mpTime(t){
    if (!isFinite(t) || t < 0) t = 0;
    var m = Math.floor(t / 60), s = Math.floor(t % 60);
    return (m < 10 ? '0' + m : '' + m) + ':' + (s < 10 ? '0' + s : '' + s);
  }

  function buildMusicPlayer(box, songs){
    var head = document.createElement('div');
    head.className = 'mp-head';
    head.innerHTML = '<label class="mp-all"><input type="checkbox" checked> 全选</label>'
      + '<span class="mp-count">共 ' + songs.length + ' 首</span>'
      + '<button type="button" class="mp-playsel">' + MP_ICON.play + '<span>播放选择</span></button>';

    var list = document.createElement('div');
    list.className = 'mp-list' + (songs.length > 10 ? ' scroll' : '');
    var rows = [];
    songs.forEach(function(s, i){
      var row = document.createElement('div');
      row.className = 'mp-row';
      row.innerHTML = '<label class="mp-ck"><input type="checkbox" checked></label>'
        + '<span class="mp-idx">' + (i + 1) + '</span>'
        + '<span class="mp-title" title="' + esc(s.name) + '">' + esc(s.name) + '</span>'
        + '<span class="mp-acts">'
        + '<button type="button" class="mp-i" data-act="play" title="播放">' + MP_ICON.play + '</button>'
        + '<a class="mp-i" data-act="dl" href="' + esc(s.href) + '" download title="下载">' + MP_ICON.dl + '</a>'
        + '<a class="mp-i" data-act="open" href="' + esc(s.href) + '" target="_blank" rel="noopener" title="打开链接">' + MP_ICON.open + '</a>'
        + '<span class="mp-dur">--:--</span>'
        + '</span>';
      list.appendChild(row);
      rows.push(row);
    });

    var bar = document.createElement('div');
    bar.className = 'mp-bar';
    bar.innerHTML = '<div class="mp-prog"><div class="mp-prog-bg"></div><div class="mp-prog-fill"></div><div class="mp-prog-dot"></div></div>'
      + '<div class="mp-ctrl">'
      + '<span class="mp-now">歌曲名</span>'
      + '<span class="mp-time">00:00/00:00</span>'
      + '<span class="mp-ctrls">'
      + '<button type="button" class="mp-btn" data-act="prev" title="上一首">' + MP_ICON.prev + '</button>'
      + '<button type="button" class="mp-btn mp-main" data-act="toggle" title="播放">' + MP_ICON.play + '</button>'
      + '<button type="button" class="mp-btn" data-act="next" title="下一首">' + MP_ICON.next + '</button>'
      + '<button type="button" class="mp-btn" data-act="mode" title="' + MP_MODES[0].tip + '">' + MP_ICON.modeOrder + '</button>'
      + '<button type="button" class="mp-btn" data-act="mute" title="静音">' + MP_ICON.volOn + '</button>'
      + '<input type="range" class="mp-vol" min="0" max="1" step="0.02" value="0.8" title="音量">'
      + '</span></div>';

    box.innerHTML = '';
    box.appendChild(head);
    box.appendChild(list);
    box.appendChild(bar);

    var audio = new Audio();
    audio.preload = 'none';
    audio.volume = 0.8;

    var nowEl = bar.querySelector('.mp-now');
    var timeEl = bar.querySelector('.mp-time');
    var fillEl = bar.querySelector('.mp-prog-fill');
    var dotEl = bar.querySelector('.mp-prog-dot');
    var toggEl = bar.querySelector('[data-act="toggle"]');
    var modeEl = bar.querySelector('[data-act="mode"]');
    var muteEl = bar.querySelector('[data-act="mute"]');
    var volEl = bar.querySelector('.mp-vol');
    var st = { idx: -1, queue: [], mode: 0 };

    function allIdx(){ return songs.map(function(x, i){ return i; }); }
    function checkedIdx(){
      var out = [];
      songs.forEach(function(x, i){ if (rows[i].querySelector('input').checked) out.push(i); });
      return out;
    }
    function paint(){
      rows.forEach(function(r, i){ r.classList.toggle('playing', i === st.idx); });
      nowEl.textContent = st.idx >= 0 && songs[st.idx] ? songs[st.idx].name : '歌曲名';
    }
    function syncTime(){
      var d = isFinite(audio.duration) && audio.duration > 0 ? audio.duration : 0;
      var cur = audio.currentTime || 0;
      timeEl.textContent = mpTime(cur) + '/' + mpTime(d);
      var pct = d ? Math.min(100, cur / d * 100) : 0;
      fillEl.style.width = pct + '%';
      dotEl.style.left = pct + '%';
    }
    function playIndex(i, queue){
      if (i == null || i < 0 || i >= songs.length) return;
      st.idx = i;
      st.queue = queue && queue.length ? queue.slice() : allIdx();
      audio.preload = 'auto';
      audio.src = songs[i].href;
      var p = audio.play();
      if (p && p.catch) p.catch(function(){});
      paint();
      syncTime();
    }
    function step(delta){
      var q = st.queue.length ? st.queue : allIdx();
      if (st.idx < 0){ playIndex(q[0], q); return; }
      var pos = q.indexOf(st.idx);
      var i;
      if (delta < 0) i = pos > 0 ? q[pos - 1] : q[q.length - 1];
      else i = (pos >= 0 && pos < q.length - 1) ? q[pos + 1] : q[0];
      playIndex(i, q);
    }

    audio.addEventListener('play', function(){
      mpPlayers.forEach(function(p){ if (p.audio !== audio) p.audio.pause(); });
      toggEl.innerHTML = MP_ICON.pause;
      toggEl.title = '暂停';
    });
    audio.addEventListener('pause', function(){
      toggEl.innerHTML = MP_ICON.play;
      toggEl.title = '播放';
    });
    audio.addEventListener('timeupdate', syncTime);
    audio.addEventListener('loadedmetadata', syncTime);
    audio.addEventListener('ended', function(){
      var q = st.queue.length ? st.queue : allIdx();
      var pos = q.indexOf(st.idx);
      var nxt = -1;
      if (st.mode === 3){
        audio.currentTime = 0;
        var rp = audio.play();
        if (rp && rp.catch) rp.catch(function(){});
        return;
      }
      if (st.mode === 2 && q.length > 1){
        do { nxt = q[Math.floor(Math.random() * q.length)]; } while (nxt === st.idx);
      } else if (st.mode !== 2 && pos >= 0 && pos < q.length - 1){
        nxt = q[pos + 1];
      } else if (st.mode === 2){
        nxt = q[0];
      } else if (st.mode === 1){
        nxt = q[0];
      }
      if (nxt < 0){ audio.currentTime = 0; st.idx = -1; st.queue = []; paint(); syncTime(); return; }
      playIndex(nxt, q);
    });

    toggEl.onclick = function(){
      if (st.idx < 0){
        var q = checkedIdx();
        playIndex(q.length ? q[0] : 0, q.length ? q : allIdx());
        return;
      }
      if (audio.paused){ var p = audio.play(); if (p && p.catch) p.catch(function(){}); }
      else audio.pause();
    };
    bar.querySelector('[data-act="prev"]').onclick = function(){ step(-1); };
    bar.querySelector('[data-act="next"]').onclick = function(){ step(1); };
    modeEl.onclick = function(){
      st.mode = (st.mode + 1) % 4;
      modeEl.innerHTML = MP_ICON[MP_MODES[st.mode].icon];
      modeEl.title = MP_MODES[st.mode].tip;
      modeEl.classList.toggle('active', st.mode !== 0);
    };
    muteEl.onclick = function(){
      audio.muted = !audio.muted;
      muteEl.innerHTML = audio.muted ? MP_ICON.volOff : MP_ICON.volOn;
    };
    volEl.oninput = function(){
      audio.volume = parseFloat(volEl.value);
      if (audio.volume > 0 && audio.muted){ audio.muted = false; muteEl.innerHTML = MP_ICON.volOn; }
    };
    bar.querySelector('.mp-prog').onclick = function(e){
      var d = audio.duration;
      if (!isFinite(d) || d <= 0) return;
      var rect = this.getBoundingClientRect();
      var pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
      audio.currentTime = pct * d;
      syncTime();
    };
    head.querySelector('.mp-playsel').onclick = function(){
      var q = checkedIdx();
      if (!q.length){ nowEl.textContent = '请先勾选要播放的歌曲'; return; }
      playIndex(q[0], q);
    };
    head.querySelector('.mp-all input').onchange = function(){
      var v = this.checked;
      rows.forEach(function(r){ r.querySelector('input').checked = v; });
    };
    rows.forEach(function(row, i){
      row.querySelector('input').onchange = function(){
        head.querySelector('.mp-all input').checked = rows.every(function(r){ return r.querySelector('input').checked; });
      };
      row.onclick = function(e){
        if (e.target.closest && e.target.closest('input,label')) return;
        var act = e.target.closest ? e.target.closest('[data-act]') : null;
        var a = act ? act.getAttribute('data-act') : null;
        if (a === 'dl' || a === 'open') return;
        playIndex(i, allIdx());
      };
    });

    // 逐个加载元数据取时长（串行，避免一次性并发拉取所有文件）
    var meta = new Audio();
    var mq = allIdx();
    (function loadMeta(){
      var i = mq.shift();
      if (i === undefined) return;
      var durEl = rows[i].querySelector('.mp-dur');
      meta.onloadedmetadata = function(){
        meta.onloadedmetadata = null;
        meta.onerror = null;
        var d = meta.duration;
        if (isFinite(d) && d > 0) durEl.textContent = mpTime(d);
        loadMeta();
      };
      meta.onerror = function(){
        meta.onloadedmetadata = null;
        meta.onerror = null;
        loadMeta();
      };
      meta.preload = 'metadata';
      meta.src = songs[i].href;
    })();

    mpPlayers.push({ audio: audio });
    paint();
    syncTime();
  }

  // 把连续的 🎵 音频链接段落收集成一个播放列表控件
  function initMusicPlayers(content){
    var audioRe = /\.(mp3|m4a|ogg|oga|wav|flac|aac)(\?.*|#.*)?$/i;
    Array.prototype.forEach.call(content.querySelectorAll('a'), function(a){
      var href = a.getAttribute('href') || '';
      if (!audioRe.test(href)) return;
      if (a.getAttribute('data-action')) return;
      if (a.closest && a.closest('.lnk-card')) return;
      if (a.closest && a.closest('.mp-box')) return;
      var p = a.closest ? a.closest('p') : null;
      if (!p || !content.contains(p) || !p.parentNode) return;
      if ((p.textContent || '').trim() !== (a.textContent || '').trim()) return;
      var name = (a.textContent || '').trim().replace(/^🎵\s*/, '');
      if (!name){
        try { name = decodeURIComponent(href.split('/').pop().split('?')[0]); } catch(e){ name = '音频'; }
      }
      var prev = p.previousElementSibling;
      var box = (prev && prev.classList && prev.classList.contains('mp-box')) ? prev : null;
      if (!box){
        box = document.createElement('div');
        box.className = 'mp-box';
        p.parentNode.insertBefore(box, p);
      }
      var song = document.createElement('div');
      song.className = 'mp-song';
      song.setAttribute('data-href', href);
      song.textContent = name;
      box.appendChild(song);
      p.parentNode.removeChild(p);
    });
    Array.prototype.forEach.call(content.querySelectorAll('.mp-box'), function(box){
      var songs = [];
      Array.prototype.forEach.call(box.querySelectorAll('.mp-song'), function(el){
        songs.push({ href: el.getAttribute('data-href') || '', name: el.textContent || '' });
      });
      if (songs.length) buildMusicPlayer(box, songs);
    });
  }

  // 文本框复制按钮 + 视频封面/大屏播放按钮（仅前端渲染层，不写入存储内容）
  function decorateBlocks(content){
    Array.prototype.forEach.call(content.querySelectorAll('pre'), function(pre){
      if (pre.querySelector('.pre-copy')) return;
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'pre-copy';
      btn.textContent = '复制';
      btn.onclick = function(){
        var clone = pre.cloneNode(true);
        var b = clone.querySelector('.pre-copy');
        if (b) b.parentNode.removeChild(b);
        var text = clone.textContent.replace(/\n+$/g, '');
        if (!text) return;
        copyText(text, btn);
      };
      pre.appendChild(btn);
    });
    Array.prototype.forEach.call(content.querySelectorAll('video'), function(v){
      if (v.getAttribute('data-poster') && !v.getAttribute('poster')) v.setAttribute('poster', v.getAttribute('data-poster'));
      v.setAttribute('playsinline', 'true');
      v.setAttribute('preload', 'none');
      var src = v.getAttribute('src')
        || (v.querySelector('source') ? v.querySelector('source').getAttribute('src') : '')
        || '';
      // wangEditor 会把 video 包在 <div data-w-e-type="video"> 里，wrapper 要挂到该 div 外层
      var slot = (v.parentNode && v.parentNode.getAttribute && v.parentNode.getAttribute('data-w-e-type') === 'video')
        ? v.parentNode : v;
      if (slot.parentNode && slot.parentNode.classList && slot.parentNode.classList.contains('vdo-wrap')) return;
      var wrap = document.createElement('div');
      wrap.className = 'vdo-wrap';
      var bigBtn = document.createElement('a');
      bigBtn.className = 'vdo-big';
      bigBtn.href = src || '#';
      bigBtn.target = '_blank';
      bigBtn.rel = 'noopener';
      bigBtn.textContent = '大屏播放 ↗';
      bigBtn.onclick = function(ev){ ev.stopPropagation(); };
      wrap.onclick = function(ev){
        if (ev.target === bigBtn) return;
        if (v.paused){ try { v.play(); } catch(e){} }
      };
      slot.parentNode.insertBefore(wrap, slot);
      wrap.appendChild(slot);
      wrap.appendChild(bigBtn);
    });
    // B站等第三方嵌入视频（iframe）：包一层容器，右上角给"原网页"入口
    Array.prototype.forEach.call(content.querySelectorAll('div[data-w-e-type="video"] iframe'), function(f){
      var holder = f.parentNode;
      if (!holder || !holder.parentNode) return;
      if (holder.parentNode.classList && holder.parentNode.classList.contains('vdo-wrap')) return;
      var wrap = document.createElement('div');
      wrap.className = 'vdo-wrap';
      holder.parentNode.insertBefore(wrap, holder);
      wrap.appendChild(holder);
      var fsrc = f.getAttribute('src') || '';
      var m = fsrc.match(/bvid=(BV[0-9A-Za-z]+)/i);
      if (m){
        var b = document.createElement('a');
        b.className = 'vdo-big';
        b.href = 'https://www.bilibili.com/video/' + m[1] + '/';
        b.target = '_blank';
        b.rel = 'noopener';
        b.textContent = 'B站原页 ↗';
        wrap.appendChild(b);
      }
    });
    // 音频链接段落 → 音乐播放器（连续多个自动合并为一个播放列表）
    initMusicPlayers(content);
  }
  function copyText(text, btn){
    var done = function(){ if (btn){ var old = btn.textContent; btn.textContent = '已复制'; setTimeout(function(){ btn.textContent = old; }, 1500); } };
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(done).catch(function(){ fallbackCopy(text, done); });
    } else { fallbackCopy(text, done); }
  }
  function fallbackCopy(text, done){
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); done(); } catch(e){}
    document.body.removeChild(ta);
  }

  var params = new URLSearchParams(location.search);
  var pid = params.get('p');
  var fid = params.get('f');
  // 用不含登录信息的绝对地址请求数据（避免 URL 残留凭据时 fetch 报错）
  var apiBase = location.protocol + '//' + location.host;

  // 主题预设（与后端保持一致）
  var THEMES = [
    { key: 'cyan',   brand: '#1b4a6b', brand2: '#0e8aa8', accent: '#e8890c' },
    { key: 'blue',   brand: '#1a3c6e', brand2: '#2b7cff', accent: '#ff7a45' },
    { key: 'purple', brand: '#4b2d73', brand2: '#8a5cf6', accent: '#ffb84d' },
    { key: 'green',  brand: '#1f5e3a', brand2: '#2ba86f', accent: '#f08c00' },
    { key: 'pink',   brand: '#6a1b4b', brand2: '#d43f7c', accent: '#ffc400' },
    { key: 'dark',   brand: '#111111', brand2: '#444444', accent: '#999999' }
  ];
  function applySettings(s){
    if (!s) return;
    var name = s.siteName || '秋风小站';
    document.getElementById('logo').innerHTML = '<span class="dot"></span>' + esc(name);
    document.title = name;
    var footer = document.querySelector('footer');
    if (footer) footer.textContent = name + ' · 基于 LAN-CMS';
    var p = THEMES.find(function(t){ return t.key === s.theme; }) || THEMES[0];
    var r = document.documentElement.style;
    r.setProperty('--brand', p.brand);
    r.setProperty('--brand2', p.brand2);
    r.setProperty('--accent', p.accent);
  }

  fetch(apiBase + '/api/settings').then(function(r){ return r.json(); }).then(applySettings).catch(function(){});

  fetch(apiBase + '/api/nodes').then(function(r){ return r.json(); }).then(function(list){
    allNodes = list;
    if (pid){ renderPage(pid); }
    else { renderFolder(fid || ''); }
  });

  document.getElementById('logo').onclick = function(){ location.href = '/'; };
})();
</script>
