<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>内容管理 - 秋风小站</title>
<link href="https://cdn.jsdelivr.net/npm/@wangeditor/editor@5.1.23/dist/css/style.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/cropperjs@1.6.2/dist/cropper.min.css" rel="stylesheet">
<style>
:root{--bg:#eef3f7;--card:#fff;--line:#d7e1ea;--ink:#1f2d3a;--ink2:#52606d;--brand:#1b4a6b;--brand2:#0e8aa8;--accent:#e8890c}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Microsoft YaHei","PingFang SC","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);height:100vh;overflow:hidden}
.app{display:flex;height:100vh}
/* 左侧 */
.side{width:270px;flex:none;background:var(--brand);color:#fff;display:flex;flex-direction:column;min-width:0}
.side-head{padding:14px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid rgba(255,255,255,.12)}
.logo{font-size:18px;font-weight:700;letter-spacing:.5px}
.logo span{color:#46c8d8}
.btn-row{display:flex;gap:6px}
.btn-s{padding:8px 0;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;flex:1;text-align:center}
.btn-new{background:var(--accent);color:#fff}
.btn-new:hover{filter:brightness(1.08)}
.btn-folder{background:rgba(255,255,255,.15);color:#fff}
.btn-folder:hover{background:rgba(255,255,255,.25)}
.btn-upload{background:rgba(255,255,255,.15);color:#fff}
.btn-upload:hover{background:rgba(255,255,255,.25)}
.tree-wrap{flex:1;overflow-y:auto;padding:8px}
.tree{list-style:none}
.tree ul{list-style:none;padding-left:18px}
.node{display:flex;align-items:center;gap:6px;padding:7px 10px;border-radius:7px;cursor:pointer;font-size:14px;color:#d5e3ee;user-select:none}
.node:hover{background:rgba(255,255,255,.08)}
.node.active{background:rgba(255,255,255,.18);color:#fff;font-weight:600}
.node svg{width:16px;height:16px;flex:none;stroke:currentColor}
.node .arrow{transition:transform .15s}
.node .arrow.open{transform:rotate(90deg)}
.node .arrow.leaf{visibility:hidden}
.node .tw{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.node .del{display:none;border:none;background:none;color:#f5a7a7;font-size:15px;cursor:pointer;line-height:1;padding:2px 6px;border-radius:5px}
.node:hover .del{display:block}
.node .del:hover{background:rgba(255,0,0,.15)}
.node .go{display:none;border:none;background:none;color:#9fe0ee;font-size:13px;cursor:pointer;padding:2px 6px;border-radius:5px}
.node:hover .go{display:block}
.node .go:hover{background:rgba(255,255,255,.1)}
.side-foot{padding:12px 14px;font-size:12px;color:#9db8cc;border-top:1px solid rgba(255,255,255,.12);display:flex;gap:10px}
.side-foot a{color:#9db8cc;text-decoration:none}
.side-foot a:hover{color:#fff}
.side-foot #btn-logout{margin-left:auto;color:#ffb4a2}
.side-foot #btn-logout:hover{color:#fff}
.side-foot a{color:#46c8d8;text-decoration:none}
/* 右侧 */
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.editor-head{display:flex;gap:12px;align-items:center;padding:14px 20px;background:var(--card);border-bottom:1px solid var(--line);flex-wrap:wrap}
.hide-chk{display:inline-flex;align-items:center;gap:5px;font-size:13px;color:#5b7080;cursor:pointer;user-select:none}
.hide-chk input{accent-color:var(--brand2)}
.hide-chk:hover{color:var(--brand2)}
#title{flex:1;min-width:220px;border:1px solid var(--line);border-radius:8px;padding:10px 14px;font-size:16px;font-weight:600;color:var(--ink);outline:none}
#title:focus{border-color:var(--brand2);box-shadow:0 0 0 3px rgba(14,138,168,.12)}
.actions{display:flex;gap:8px;align-items:center}
.btn-save{padding:9px 22px;border:none;border-radius:8px;background:var(--brand2);color:#fff;font-size:14px;font-weight:600;cursor:pointer}
.btn-save:hover{background:#0b7a95}
.btn-preview{padding:9px 18px;border:1px solid var(--brand2);border-radius:8px;background:#fff;color:var(--brand2);font-size:14px;font-weight:600;cursor:pointer}
.btn-preview:hover{background:#e8f6fa}
.status{font-size:12px;color:var(--ink2);min-width:70px}
#editor-area{flex:1;display:none;flex-direction:column;min-height:0}
#editor-area.show{display:flex}
#editor-container{flex:1;overflow-y:auto}
.w-e-text-container{background:var(--card)}
#panel-area{flex:1;display:none;overflow-y:auto}
#panel-area.show{display:block}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:30px 36px;margin:20px;color:var(--ink2);font-size:14px}
.panel h2{font-size:18px;color:var(--ink);margin-bottom:10px}
.frow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.fbtn{display:inline-flex;align-items:center;gap:6px;padding:9px 18px;border-radius:8px;background:var(--brand2);color:#fff;font-size:14px;font-weight:600;text-decoration:none}
.fbtn svg{width:15px;height:15px}
.hint{margin-top:8px;font-size:13px;color:var(--ink3)}
/* 弹窗 */
.mask{position:fixed;inset:0;background:rgba(15,25,35,.55);display:none;align-items:center;justify-content:center;z-index:999}
.mask.show{display:flex}
.modal{background:#fff;border-radius:12px;padding:22px 24px;width:min(560px,92vw);max-height:88vh;overflow:auto;box-shadow:0 18px 50px rgba(0,0,0,.3)}
.modal h3{font-size:16px;margin-bottom:16px}
.mrow{margin-bottom:14px}
.mrow label{display:block;font-size:13px;color:var(--ink2);margin-bottom:6px}
.mrow input[type=text],.mrow select{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px;outline:none}
.mrow input:focus,.mrow select:focus{border-color:var(--brand2)}
.mrow .note{font-size:12px;color:var(--ink3);margin-top:4px}
.mbtn-row{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
.mbtn{padding:8px 20px;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer}
.mbtn-ok{background:var(--brand2);color:#fff}
.mbtn-ok:hover{background:#0b7a95}
.mbtn-cancel{background:#e4e9ee;color:var(--ink2)}
.mbtn-cancel:hover{background:#d3dbe3}
.crop-box{max-height:55vh;overflow:hidden;text-align:center}
.crop-box img{max-width:100%;display:block;margin:0 auto}
@media (max-width:700px){
  body{overflow:auto}
  .app{flex-direction:column;height:auto;min-height:100vh}
  .side{width:100%;max-height:40vh}
  .main{min-height:60vh}
  #editor-container{height:50vh}
}
/* 编辑区内链接框卡片样式（所见即所得） */
#editor-container .lnk-grid{display:grid;gap:10px;margin:10px 0}
#editor-container .lnk-grid.md{grid-template-columns:repeat(3,minmax(0,1fr))}
#editor-container .lnk-grid.sm{grid-template-columns:repeat(4,minmax(0,1fr))}
#editor-container .lnk-card{border:1px solid #d7e1ea;border-radius:10px;background:#f6f9fc;padding:10px 14px;margin:8px 0;transition:border-color .2s,box-shadow .2s,transform .2s}
/* 默认（无特效）不加任何 hover 效果，特效由 lnk-effect-xxx class 决定 */
#editor-container .lnk-card.lnk-effect-highlight:hover{border-color:#0e8aa8;box-shadow:0 0 0 2px rgba(14,138,168,.2)}
#editor-container .lnk-card.lg{width:100%}
#editor-container .lnk-grid .lnk-card{margin:0}
#editor-container .lnk-card h2,#editor-container .lnk-card h3,#editor-container .lnk-card h5{margin:0;padding:0;border:none;font-size:16px;color:#1f2d3a;background:transparent}
#editor-container .lnk-card h2{font-size:17px}
#editor-container .lnk-card h5{font-size:14px}
#editor-container .lnk-card>p:first-of-type{margin:4px 0 0;font-size:13px;color:#7b8794}
#editor-container .lnk-card>p:last-child{margin:8px 0 0}
#editor-container .lnk-card>p:last-child a{display:inline-block;padding:4px 12px;background:#0e8aa8;color:#fff;border-radius:6px;text-decoration:none;font-size:13px;font-weight:600}
@media (max-width:760px){
  #editor-container .lnk-grid.md{grid-template-columns:repeat(2,minmax(0,1fr))}
  #editor-container .lnk-grid.sm{grid-template-columns:repeat(2,minmax(0,1fr))}
}
/* 设置弹窗样式 */
.s-set{margin-bottom:18px}
.s-head{font-size:13px;font-weight:600;color:#34495a;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.theme-row{display:flex;flex-wrap:wrap;gap:10px}
.theme-opt{position:relative;cursor:pointer;border-radius:10px;padding:10px 12px 8px;border:2px solid transparent;transition:all .15s;background:#f6f9fc;text-align:center;font-size:12px;color:#34495a}
.theme-opt:hover{border-color:var(--brand2)}
.theme-opt.selected{border-color:var(--brand2);background:#eaf5f8;box-shadow:0 0 0 3px rgba(14,138,168,.15)}
.theme-opt .swatch{width:34px;height:24px;border-radius:6px;margin:0 auto 5px;border-top:5px solid;border-right:6px solid;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.theme-opt .tname{font-weight:600}
/* 编辑区 link card 特效 class（与前台保持一致） */
#editor-container .lnk-card.lnk-effect-shake:hover{animation:lnk-shake .35s}
#editor-container .lnk-card.lnk-effect-scale:hover{transform:scale(1.03);transition:transform .2s}
#editor-container .lnk-card.lnk-effect-glow:hover{box-shadow:0 0 0 2px rgba(14,138,168,.25),0 0 20px rgba(14,138,168,.18)}
@keyframes lnk-shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-3px)}40%{transform:translateX(3px)}60%{transform:translateX(-2px)}80%{transform:translateX(2px)}}
/* 特效多选 chips */
.fx-row{display:flex;flex-wrap:wrap;gap:8px}
.fx-opt{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border:1px solid var(--line);border-radius:999px;font-size:13px;color:#34495a;cursor:pointer;user-select:none;background:#f7fafc;transition:all .15s}
.fx-opt:hover{border-color:var(--brand2)}
.fx-opt.on{background:#eaf5f8;border-color:var(--brand2);color:var(--brand2);font-weight:600}
.fx-opt input{margin:0;accent-color:var(--brand2)}
.fx-clear{font-size:12px;color:var(--brand2);cursor:pointer;text-decoration:none;white-space:nowrap}
.fx-clear:hover{text-decoration:underline}
/* 链接框卡片右键菜单 */
#card-menu{position:fixed;z-index:9999;display:none;min-width:130px;background:#fff;border:1px solid #dbe4ec;border-radius:8px;box-shadow:0 8px 24px rgba(16,42,67,.18);padding:5px;font-size:13px}
#card-menu.show{display:block}
#card-menu a{display:block;padding:7px 12px;color:#2c3e50;text-decoration:none;border-radius:5px;cursor:pointer;white-space:nowrap}
#card-menu a:hover{background:#eef6f9;color:var(--brand2)}
#card-menu a.danger:hover{background:#fdecec;color:#d33}
#card-menu a.disabled{opacity:.35;pointer-events:none}
/* 卡片被选中（右键 / 单击卡片空白处）时的提示 */
#editor-container .lnk-card.ctx-active{outline:2px solid rgba(14,138,168,.5);outline-offset:2px}
/* ---- 插入文本框（代码块外观，保留粘贴的换行/缩进）---- */
#editor-container pre{position:relative;margin:12px 0;padding:18px 18px 18px 20px;border:1px solid #e3e8ee;border-radius:10px;background:#f7f9fb;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;line-height:1.65;color:#2b3440;overflow:auto;max-height:420px;white-space:pre-wrap;word-break:break-word}
#editor-container pre code{font-family:inherit;font-size:inherit;background:transparent;padding:0;white-space:pre-wrap}
/* ---- 插入视频（封面 + 点击播放）---- */
#editor-container video{display:block;width:100%;max-width:640px;margin:12px 0;border-radius:10px;background:#000}
/* 编辑区悬浮"复制"按钮（文本框右上角）*/
#pre-copy{position:fixed;display:none;z-index:9998;padding:5px 10px;border:1px solid #dbe4ec;border-radius:6px;background:#fff;color:#2c3e50;font-size:12px;cursor:pointer;box-shadow:0 2px 8px rgba(16,42,67,.12)}
#pre-copy:hover{background:#eef6f9;color:var(--brand2)}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="side-head">
      <div class="logo" id="site-logo">秋风小站</div>
      <div class="btn-row">
        <button id="btn-new" class="btn-s btn-new">＋ 新建页面</button>
        <button id="btn-folder" class="btn-s btn-folder">＋ 文件夹</button>
        <button id="btn-upload" class="btn-s btn-upload">上传附件</button>
      </div>
    </div>
    <div class="tree-wrap"><ul id="tree" class="tree"></ul></div>
    <div class="side-foot"><a href="/" target="_blank">查看前台 →</a><a href="#" id="btn-settings">⚙ 设置</a><a href="#" id="btn-logout">退出登录</a></div>
  </aside>
  <main class="main">
    <div class="editor-head">
      <input id="title" type="text" placeholder="输入标题…">
      <label class="hide-chk" title="勾选后，未登录访问前台时不显示该页面"><input type="checkbox" id="chk-hidden"> 仅登录可见</label>
      <div class="actions">
        <button id="btn-save" class="btn-save">保存</button>
        <button id="btn-preview" class="btn-preview">预览</button>
        <span id="status" class="status"></span>
      </div>
    </div>
    <div id="editor-area">
      <div id="toolbar-container"></div>
      <div id="editor-container"></div>
    </div>
    <div id="panel-area"></div>
  </main>
</div>

<!-- 通用弹窗（裁剪 / 链接） -->
<div class="mask" id="mask">
  <div class="modal" id="modal-box"></div>
</div>

<!-- 链接框卡片右键菜单 -->
<div id="card-menu">
  <a data-op="up">↑ 上移</a>
  <a data-op="down">↓ 下移</a>
  <a data-op="copy">复制</a>
  <a data-op="cut">剪切</a>
  <a data-op="paste">粘贴</a>
  <a data-op="edit">编辑</a>
  <a data-op="del" class="danger">删除</a>
</div>

<!-- 文本框右上角悬浮复制按钮 -->
<button id="pre-copy" type="button">复制</button>

<script src="https://cdn.jsdelivr.net/npm/@wangeditor/editor@5.1.23/dist/index.js"></script>
<script src="https://cdn.jsdelivr.net/npm/cropperjs@1.6.2/dist/cropper.min.js"></script>
<script>
(function(){
  var ICON = {
    folder: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>',
    page: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>',
    file: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M13 2v7h7"/></svg>',
    arrow: '<svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>',
    link: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1.5 1.5"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1.5-1.5"/></svg>',
    crop: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 2v16h16"/><path d="M18 8h4v4M6 10H2v4M16 6H2v4"/></svg>',
    border: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 9h8M8 15h8M9 8v8M15 8v8"/></svg>',
    net: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.5 3 14 0 18M12 3c-3 3.5-3 14 0 18"/></svg>',
    card: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 10h18M7 15h4"/></svg>',
    face: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 14.5s1.5 2 3.5 2 3.5-2 3.5-2M9 9.5h.01M15 9.5h.01"/></svg>',
    dl: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v12M6 9l6 6 6-6"/><path d="M4 19h16"/></svg>',
    textbox: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M7 9h10M7 13h7M7 17h4"/></svg>',
    video: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9.5l5 2.5-5 2.5z"/></svg>',
    audio: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>'
  };

  var allNodes = [];
  var currentId = null;
  var currentType = null;
  var editor = null;
  var expanded = {};
  var cardifyEditor = null;   // 在 initEditor 内赋值，外部 selectNode 调用
  var uncardifyEditor = null; // 拆包：重渲染/结构性修改前先还原成普通块结构
  var statusEl = document.getElementById('status');

  function toast(msg){ statusEl.textContent = msg; clearTimeout(toast._t); toast._t = setTimeout(function(){ statusEl.textContent=''; }, 2500); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function childrenOf(id){ return allNodes.filter(function(n){ return n.parent === id; }); }
  // 树排序：文件夹优先，组内按标题排序，避免保存后节点乱跳
  function sortKids(list){
    return list.slice().sort(function(a,b){
      if (a.type==='folder' && b.type!=='folder') return -1;
      if (a.type!=='folder' && b.type==='folder') return 1;
      return (a.title < b.title) ? -1 : (a.title > b.title ? 1 : 0);
    });
  }
  function findNode(id){ for (var i=0;i<allNodes.length;i++){ if (allNodes[i].id===id) return allNodes[i]; } return null; }
  function fmtSize(b){
    if (!b) return '';
    if (b < 1024) return b + ' B';
    if (b < 1048576) return (b/1024).toFixed(1) + ' KB';
    if (b < 1073741824) return (b/1048576).toFixed(1) + ' MB';
    return (b/1073741824).toFixed(2) + ' GB';
  }

  /* ============ 弹窗 ============ */
  /* ---- 内容清洗：修复畸形表格（嵌套表格解包、空行/空表删除），防止 setHtml 解析崩溃 ----
     用户文档可能因早期操作产生 table 嵌 table / 空 table-row / 表格存文本等畸形结构，
     会让 wangEditor 内置菜单轮询抛 "Cannot get the leaf node" 且 setHtml 直接崩溃。 */
  // 判断一个元素是否是卡片三连的开头（h2/h3/h5 + p + p(a)）
  function isCardStart(el){
    if (!el || !/^H[235]$/.test(el.tagName)) return false;
    var s1 = el.nextElementSibling, s2 = s1 && s1.nextElementSibling;
    return !!(s1 && s1.tagName === 'P' && s2 && s2.tagName === 'P' && s2.querySelector('a'));
  }
  function isEmptyPara(el){
    return !!(el && el.tagName === 'P' && !el.textContent.trim() && !el.querySelector('img,video,table,hr'));
  }
  /* 清理卡片周围的空段落：
     1. 相邻两张卡片之间的空段落删掉（让它们合并进同一个 grid，避免 N 张卡堆出 N 个空行）
     2. 连续空段落折叠为一个
     3. 文档末尾保留一个空段落，供光标停靠 */
  function cleanupEmptyParas(div){
    // 1. 卡片之间的空段落：前一个是卡片链接段(<p><a></a></p>)、后一个是另一张卡片开头 → 删除
    var ps = Array.prototype.slice.call(div.querySelectorAll('p'));
    for (var i = 0; i < ps.length; i++){
      var p = ps[i];
      if (!isEmptyPara(p)) continue;
      var prev = p.previousElementSibling;
      var next = p.nextElementSibling;
      var prevIsCardLink = prev && prev.tagName === 'P' && prev.querySelector('a');
      if (prevIsCardLink && isCardStart(next)){ p.parentNode.removeChild(p); }
    }
    // 2. 折叠连续空段落为一个
    var kids = Array.prototype.slice.call(div.children);
    var lastEmpty = false;
    for (var j = 0; j < kids.length; j++){
      var el = kids[j];
      if (isEmptyPara(el)){
        if (lastEmpty) el.parentNode.removeChild(el);
        else lastEmpty = true;
      } else {
        lastEmpty = false;
      }
    }
    // 3. 末尾确保有一个空段落
    var last = div.lastElementChild;
    if (!isEmptyPara(last)){
      var np = document.createElement('p');
      np.innerHTML = '<br>';
      div.appendChild(np);
    }
  }
  function sanitizeContent(html){
    if (!html) return '<p><br></p>';
    var div = document.createElement('div');
    div.innerHTML = html;
    var changed = false;
    // 1. 解包嵌套表格：内层 table 移到外层 table 之后，变成两个独立表格
    var nested = div.querySelectorAll('table table');
    for (var ni = nested.length - 1; ni >= 0; ni--){
      var inner = nested[ni];
      var outer = inner.parentNode;
      while (outer && outer.tagName !== 'TABLE') outer = outer.parentNode;
      if (outer && outer.parentNode){
        var next = outer.nextSibling;
        var box = document.createElement('div');
        box.appendChild(inner);
        while (box.firstChild) outer.parentNode.insertBefore(box.firstChild, next);
        changed = true;
      }
    }
    // 2. 删除空 table-row（没有 td/th 的行）
    Array.prototype.forEach.call(div.querySelectorAll('tr'), function(tr){
      if (!tr.querySelector('td,th')){ var p = tr.parentNode; if (p) p.removeChild(tr); changed = true; }
    });
    // 3. 删除空 table（没有行的表）
    Array.prototype.forEach.call(div.querySelectorAll('table'), function(t){
      if (!t.querySelector('tr')){ var p = t.parentNode; if (p) p.removeChild(t); changed = true; }
    });
    // 4. 清除块级结构间的孤立空白文本（table/tbody/根层级），
    //    wangEditor setHtml 解析时会把它们变成孤立空 text 节点 → "Cannot resolve a DOM node" 崩溃
    function stripBlankText(el){
      Array.prototype.forEach.call(Array.prototype.slice.call(el.childNodes), function(cn){
        if (cn.nodeType === 3 && (!cn.textContent || !cn.textContent.trim())){
          el.removeChild(cn); changed = true;
        } else if (cn.nodeType === 1 && (cn.tagName === 'TABLE' || cn.tagName === 'TBODY' || cn.tagName === 'THEAD' || cn.tagName === 'TR')){
          stripBlankText(cn);
        }
      });
    }
    stripBlankText(div);
    // 5. 空单元格（td/th 无内容）补 <br>：空 td 会被 setHtml 解析成孤立空 text 节点而崩溃
    Array.prototype.forEach.call(div.querySelectorAll('td,th'), function(c){
      if (!c.textContent.trim()){ c.innerHTML = '<br>'; changed = true; }
    });
    // 6. 清理卡片周围的空段落（合并卡片间空行、折叠连续空行、末尾保留一个光标停靠段）
    cleanupEmptyParas(div);
    return div.innerHTML || '<p><br></p>';
  }
  /* 安全 setHtml：先清空选区 + 内容清洗，再重建内容。
     wangEditor 在 setHtml 后会用残留的旧 selection 去查内置菜单状态，
     若旧选区指向表格等非叶子节点会持续抛 "Cannot get the leaf node"（leaf/marks/getValue 循环崩）；
     文档中的孤立空白文本/畸形表格则会让 setHtml 渲染本身崩溃。 */
  function setHtmlSafe(ed, html){
    try { if (ed.selection) ed.selection = null; } catch(e){}
    // 重建内容前先拆掉编辑区里的卡片 wrapper，否则 wangEditor 重渲染会撞上被移动过的 DOM 节点
    try { if (uncardifyEditor) uncardifyEditor(); } catch(e){}
    ed.setHtml(sanitizeContent(html));
  }
  /* ============ 链接框卡片状态（动作 / 特效）============
     wangEditor 的 link 元素只序列化 href/target，自定义 data-* 属性在 setHtml/getHtml 往返中会被丢弃，
     所以卡片状态不能只依赖 <a data-effect>。这里以"页面级卡片数组"为真源：
     - 加载：extractCardState 从存储 HTML 里读走 data-action/data-effect，并从 HTML 中剥离
     - 保存：injectCardState 把状态数组按卡片顺序写回序列化 HTML 的 <a> 上
     前端 index.html 直接读这两个属性渲染。 */
  var pageCards = [];       // [{ action:'打开', effects:['shake'] }, ...] 按卡片在文档中的顺序
  var FX_KEYS = ['highlight', 'shake', 'scale', 'glow'];

  function parseEffects(v){
    if (!v) return [];
    return String(v).split(/\s+/).filter(function(x){ return x && x !== 'none' && FX_KEYS.indexOf(x) >= 0; });
  }
  // 遍历 HTML 副本中的卡片（h2/h3/h5 + p + p(a) 三连），回调拿到 <a>
  function eachCardAnchor(html, cb){
    var div = document.createElement('div');
    div.innerHTML = html || '';
    var hs = div.querySelectorAll('h2,h3,h5');
    var n = 0;
    for (var i = 0; i < hs.length; i++){
      var h = hs[i], s1 = h.nextElementSibling, s2 = s1 && s1.nextElementSibling;
      if (!(s1 && s1.tagName === 'P' && s2 && s2.tagName === 'P')) continue;
      var a = s2.querySelector('a');
      if (!a) continue;
      cb(a, n++);
    }
    return div.innerHTML;
  }
  function extractCardState(html){
    var state = [];
    var clean = eachCardAnchor(html, function(a){
      state.push({
        action: a.getAttribute('data-action') || '',
        effects: parseEffects(a.getAttribute('data-effect'))
      });
      a.removeAttribute('data-action');
      a.removeAttribute('data-effect');
    });
    return { html: clean, state: state };
  }
  function injectCardState(html, state){
    return eachCardAnchor(html, function(a, n){
      var st = state[n];
      if (!st) return;
      if (st.action) a.setAttribute('data-action', st.action);
      if (st.effects && st.effects.length) a.setAttribute('data-effect', st.effects.join(' '));
    });
  }
  /* ============ 视频块状态（src / poster）============
     wangEditor 的 video 节点往返会丢掉 poster，所以和卡片一样用页面级数组存真源：
     保存时按文档顺序把 poster 写回 <video data-poster>，加载时读走并剥离。 */
  var pageVideos = [];
  function eachVideo(html, cb){
    var div = document.createElement('div');
    div.innerHTML = html || '';
    Array.prototype.forEach.call(div.querySelectorAll('video'), cb);
    return div.innerHTML;
  }
  function extractVideoState(html){
    var state = [];
    var clean = eachVideo(html, function(v){
      state.push({ src: v.getAttribute('src') || '', poster: v.getAttribute('data-poster') || v.getAttribute('poster') || '' });
      v.removeAttribute('data-poster');
    });
    return { html: clean, state: state };
  }
  function injectVideoState(html, state){
    return eachVideo(html, function(v, n){
      var st = state[n];
      if (!st) return;
      if (st.poster) v.setAttribute('data-poster', st.poster);
      else v.removeAttribute('data-poster');
    });
  }
  // 保存时以编辑区 DOM 里的 video 为准回收封面（增删视频后顺序可能变）
  function videosFromDom(){
    var box = document.querySelector('#editor-container [contenteditable="true"]')
           || document.querySelector('#editor-container [data-slate-editor]');
    if (!box) return null;
    var out = [];
    Array.prototype.forEach.call(box.querySelectorAll('video'), function(v){
      out.push({ src: v.getAttribute('src') || '', poster: v.getAttribute('poster') || '' });
    });
    return out;
  }
  // 从编辑区已 cardify 的卡片 wrapper 上回收状态（卡片增删后索引会变，DOM 才是最终真相）
  function collectCardStateFromDom(){
    var box = document.querySelector('#editor-container [contenteditable="true"]')
           || document.querySelector('#editor-container [data-slate-editor]');
    if (!box) return null;
    var cards = box.querySelectorAll('.lnk-card');
    if (!cards.length) return null;
    var state = [];
    Array.prototype.forEach.call(cards, function(w){
      var effects = [];
      Array.prototype.forEach.call(w.classList, function(c){
        if (c.indexOf('lnk-effect-') === 0 && c !== 'lnk-effect-none') effects.push(c.slice('lnk-effect-'.length));
      });
      state.push({ action: w.getAttribute('data-card-action') || '', effects: effects });
    });
    return state;
  }
  // 保存时使用：DOM 能读到就用 DOM，读不到（还没 cardify）就用 pageCards
  function currentCardState(){
    var domState = collectCardStateFromDom();
    if (!domState) return pageCards;
    return domState.map(function(s, i){
      if (!s.action && pageCards[i] && pageCards[i].action) s.action = pageCards[i].action;
      return s;
    });
  }

  /* ============ 站点设置 ============ */

    { key: 'purple', name: '紫',   brand: '#4b2d73', brand2: '#8a5cf6', accent: '#ffb84d' },
    { key: 'green',  name: '绿',   brand: '#1f5e3a', brand2: '#2ba86f', accent: '#f08c00' },

      + '<div class="s-head">🔒 修改密码</div>'

      + '<input id="pw-new" type="password" placeholder="新密码（留空则不修改）" style="width:100%;padding:10px 12px;border:1px solid #d7e0e6;border-radius:8px;margin-bottom:8px;font-size:14px;box-sizing:border-box">'

    // 阻止 mousedown 冒泡（避免面板被 mask 关闭）

      fetch('/api/settings', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: settingsBody }).then(function(r){

        fd.append('old', oldp); fd.append('new', np); fd.append('confirm', np2);

          return { ok: true };
        });
      }).then(function(ret){
        if (ret === null) return;

  // openPasswordModal 已合并到 openSettingsModal，保留一个空壳避免旧引用报错
  function openPasswordModal(){ openSettingsModal(); }

  /* ============ 树 ============ */
  function renderTree(){
    var html = '';
    sortKids(childrenOf('')).forEach(function(n){ html += nodeHTML(n, 0); });
    document.getElementById('tree').innerHTML = html;
    bindTreeEvents();
  }
  function nodeHTML(n, depth){
    var kids = childrenOf(n.id);
    var open = !!expanded[n.id];
    var icon = n.type==='folder' ? ICON.folder : (n.type==='file' ? ICON.file : ICON.page);
    var html = '<li><div class="node' + (n.id===currentId?' active':'') + '" data-id="' + n.id + '" style="padding-left:' + (10+depth*16) + 'px">';
    if (n.type === 'folder'){
      html += ICON.arrow.replace('class="arrow"', 'class="arrow' + (kids.length ? (open?' open':'') : ' leaf') + '"');
    } else {
      html += '<svg class="arrow leaf"></svg>';
    }
    html += icon;
    html += '<span class="tw">' + esc(n.title || '(未命名)') + '</span>';
    if (n.type === 'page') html += '<button class="go" data-act="preview" title="预览">↗</button>';
    html += '<button class="del" data-act="del" title="删除">×</button>';
    html += '</div>';
    if (kids.length && open){
      html += '<ul>';
      sortKids(kids).forEach(function(k){ html += nodeHTML(k, depth+1); });
      html += '</ul>';
    }
    html += '</li>';
    return html;
  }
  function bindTreeEvents(){
    Array.prototype.forEach.call(document.querySelectorAll('#tree .node'), function(el){
      el.onclick = function(e){
        var act = e.target && e.target.getAttribute ? e.target.getAttribute('data-act') : null;
        var id = el.getAttribute('data-id');
        if (act === 'del'){
          e.stopPropagation();
          var n = findNode(id);
          if(!confirm('确定删除「' + ((n&&n.title)||'') + '」及其全部子内容？')) return;
          fetch('/api/nodes/' + id, {method:'DELETE'}).then(function(r){return r.json();}).then(function(res){
            if (res.deleted){ toast('已删除 ' + res.deleted + ' 项'); }
            if(currentId === id){ currentId = null; currentType = null; }
            loadAll();
          });
          return;
        }
        if (act === 'preview'){
          e.stopPropagation();
          window.open('/?p=' + id, '_blank');
          return;
        }
        var n = findNode(id);
        if (n && n.type === 'folder'){
          expanded[id] = !expanded[id];
          renderTree();
        }
        selectNode(id);
      };
    });
  }

  /* ============ 选中与编辑 ============ */
  function selectNode(id){
    var n = findNode(id);
    if (!n) return;
    currentId = n.id;
    currentType = n.type;
    document.getElementById('title').value = n.title || '';
    document.getElementById('chk-hidden').checked = !!n.hidden;
    Array.prototype.forEach.call(document.querySelectorAll('#tree .node'), function(el){
      el.classList.toggle('active', el.getAttribute('data-id')===id);
    });
    var ea = document.getElementById('editor-area');
    var pa = document.getElementById('panel-area');
    if (n.type === 'page'){
      pa.classList.remove('show');
      ea.classList.add('show');
      if (!editor) initEditor();
      // 先从存储内容里提取卡片状态（动作/特效）与视频封面，再加载剥离后的 HTML
      var ex = extractCardState(n.content || '');
      pageCards = ex.state;
      var exV = extractVideoState(ex.html);
      pageVideos = exV.state;
      setHtmlSafe(editor, sanitizeContent(exV.html) || '<p><br></p>');
      // setHtmlSafe 会触发 onChange → 300ms 后 cardify，但我们立即也执行一次让卡片立即可见
      setTimeout(function(){ cardifyEditor(); }, 50);
    } else {
      ea.classList.remove('show');
      pa.classList.add('show');
      if (n.type === 'folder'){
        pa.innerHTML = '<div class="panel"><h2>' + esc(n.title) + '</h2>'
          + '<div class="hint">在此文件夹下：新建页面 / 新建子文件夹 / 上传附件。文件会自动生成下载链接。</div></div>';
      } else {
        pa.innerHTML = '<div class="panel"><h2>' + esc(n.title) + '</h2>'
          + '<div class="frow"><a class="fbtn" href="' + esc(n.content) + '" download>' + ICON.dl + '下载文件</a>'
          + '<span class="hint">' + fmtSize(n.size) + ' · ' + esc(n.content) + '</span></div></div>';
      }
    }
  }

  /* ============ wangEditor ============ */
  function initEditor(){
    var E = window.wangEditor;

    /* ---- 公共：定位选中节点（不依赖 getFragment/getSelectedNodeByType，CDN 版均不可靠） ---- */
    function nodeAtPath(ed, path){
      var node = ed;
      for (var i=0;i<path.length;i++){
        if (!node || !node.children) return null;
        node = node.children[path[i]];
      }
      return node;
    }
    function findPathBySrc(ed, src){
      var kids = ed.children || [];
      for (var i=0;i<kids.length;i++){
        var p = kids[i];
        if (p && p.children) for (var j=0;j<p.children.length;j++){
          if (p.children[j] && p.children[j].type === 'image' && p.children[j].src === src) return [i, j];
        }
      }
      return null;
    }
    function findPathByType(ed, type){
      var kids = ed.children || [];
      for (var i=0;i<kids.length;i++){
        var p = kids[i];
        if (p && p.children) for (var j=0;j<p.children.length;j++){
          if (p.children[j] && p.children[j].type === type) return [i, j];
        }
      }
      return null;
    }
    var lastImgPath = null;   // 最近一次点击选中的图片 path
    var lastTablePath = null; // 最近一次点击选中的表格 path
    function initClickTracking(ed){
      var box = document.getElementById('editor-container');
      if (!box) return;
      box.addEventListener('click', function(e){
        var el = e.target;
        while (el && el !== box){
          if (el.tagName === 'IMG'){
            var p = findPathBySrc(ed, el.getAttribute('src'));
            if (p) lastImgPath = p;
            return;
          }
          if (el.tagName === 'TABLE'){
            var tp = findPathByType(ed, 'table');
            if (tp) lastTablePath = tp;
            return;
          }
          if (el.tagName === 'A'){
            // 卡片链接（打开 →）：点击进入卡片编辑弹窗
            var cur = el.parentNode;
            var h = null;
            if (cur && cur.tagName === 'P'){
              var s1 = cur.previousElementSibling;
              if (s1 && s1.tagName === 'P'){
                var s2 = s1.previousElementSibling;
                if (s2 && /^H[235]$/.test(s2.tagName)) h = s2;
              }
            }
            if (h){
              e.preventDefault(); e.stopPropagation();
              openCardEditor(ed, h);
            }

    /* 卡片编辑弹窗：读取当前链接框内容，确定后重建三块（标题/介绍/打开链接） */

    // 获取当前应操作的图片/表格节点：点击记录 > 当前选区 > DOM 选区
    function getSelectedNode(ed, types){
      if (types.indexOf('image') >= 0 && lastImgPath){
        var n1 = nodeAtPath(ed, lastImgPath);
        if (n1 && n1.type === 'image') return n1;
      }
      if (types.indexOf('table') >= 0 && lastTablePath){
        var n2 = nodeAtPath(ed, lastTablePath);
        if (n2 && n2.type === 'table') return n2;
      }
      try {
        var sel = ed.selection;
        // 注意：不要在此 restoreSelection/focus —— 选中表格节点时 focus 会触发内置菜单 leaf 崩溃
        if (sel && sel.anchor && sel.anchor.path){
          for (var i=sel.anchor.path.length; i>=0; i--){
            var n = nodeAtPath(ed, sel.anchor.path.slice(0, i));
            if (n && types.indexOf(n.type) >= 0) return n;
          }
        }
      } catch(e){}
      try {
        var s = window.getSelection();
        if (s && s.rangeCount > 0){
          var r = s.getRangeAt(0);
          var el = r.startContainer;
          if (el.nodeType === 3) el = el.parentNode;
          while (el && el !== document.body){
            if (el.tagName === 'IMG' && types.indexOf('image') >= 0) return { type: 'image', src: el.getAttribute('src') };
            if (el.tagName === 'TABLE' && types.indexOf('table') >= 0) return { type: 'table' };
            el = el.parentNode;
          }
        }
      } catch(e){}
      return null;
    }

    /* 自定义菜单：插入链接（支持站内页面 + 附件文件，自动填充地址） */
    function LinkMenu(){
      this.title = '插入链接';
      this.tag = 'button';
      this.iconSvg = ICON.link;
    }
    LinkMenu.prototype.getValue = function(){ return ''; };
    LinkMenu.prototype.isActive = function(){ return false; };
    LinkMenu.prototype.isDisabled = function(){ return false; };
    LinkMenu.prototype.exec = function(ed){
      // 直接用编辑器保存的选区取选中文字（不 focus 编辑器，避免点击弹窗输入框时焦点被抢走）
      var selText = '';
      var savedSel = null;
      try {
        selText = (ed.getSelectionText() || '').trim();
        // 保存选区副本：弹窗打开期间编辑器 blur 会清空 selection，确定时用它恢复插入位置
        savedSel = ed.selection ? JSON.parse(JSON.stringify(ed.selection)) : null;
      } catch(e){}
      // 关键：主动让编辑器失焦并清空选区。
      // 工具栏按钮 click 会 preventDefault，编辑器因此始终持有焦点；
      // 用户点击弹窗输入框时才触发 blur → deselect → onChange → 重渲染 → 输入框光标被抢（一闪而过）。
      try { ed.blur(); } catch(e){}
      try { if (ed.selection) ed.selection = null; } catch(e){}
      var pages = allNodes.filter(function(n){ return n.type === 'page'; });
      var files = allNodes.filter(function(n){ return n.type === 'file'; });
      function optHtml(list, prefix){
        return list.map(function(p){
          var url = p.type === 'file' ? p.content : '/?p=' + p.id;
          return '<option value="' + esc(url) + '" data-title="' + esc(p.title) + '">' + esc(prefix + p.title) + '</option>';
        }).join('');
      }
      var opts = '';
      if (pages.length) opts += '<optgroup label="站内页面">' + optHtml(pages, '📄 ') + '</optgroup>';
      if (files.length) opts += '<optgroup label="附件 / 软件（自动填下载地址）">' + optHtml(files, '📦 ') + '</optgroup>';
      var selectedTitle = '';
      openModal(
        '<h3>插入链接</h3>'
        + '<div class="mrow"><label>链接文本（选中文字自动填入，留空则用页面标题/文件名）</label><input type="text" id="lk-text" value="' + esc(selText) + '" placeholder="显示的文字"></div>'
        + '<div class="mrow"><label>站内页面 / 附件（选择后自动填充地址）</label><select id="lk-page"><option value="">— 不选，手动填地址 —</option>' + opts + '</select></div>'
        + '<div class="mrow"><label>链接地址</label><input type="text" id="lk-url" placeholder="http://… 或 /?p=页面ID 或 /files/附件名"></div>'
        + '<div class="mrow"><label>打开方式</label><select id="lk-target"><option value="_blank">新标签页打开</option><option value="_self">当前页打开</option></select></div>'
        + '<div class="mrow note">提示：附件地址以 /files/ 开头（如上图上传附件后自动生成），手动填时请写完整路径。</div>'
        + '<div class="mbtn-row"><button class="mbtn mbtn-cancel" id="lk-cancel">取消</button><button class="mbtn mbtn-ok" id="lk-ok">确定</button></div>'
      );
      // 加固：弹窗输入框 mousedown 阻止冒泡，避免编辑器/全局监听抢走焦点（光标一闪而过）
      Array.prototype.forEach.call(document.querySelectorAll('#modal-box input, #modal-box select, #modal-box button'), function(el){
        el.addEventListener('mousedown', function(ev){ ev.stopPropagation(); });
      });

    /* 自定义菜单：裁剪图片 */
    function CropMenu(){
      this.title = '裁剪图片';
      this.tag = 'button';
      this.iconSvg = ICON.crop;
    }
    CropMenu.prototype.getValue = function(){ return ''; };
    CropMenu.prototype.isActive = function(){ return false; };
    CropMenu.prototype.isDisabled = function(){ return false; };
    CropMenu.prototype.exec = function(ed){
      var imgNode = getSelectedNode(ed, ['image']);
      if (!imgNode || !imgNode.src){ toast('请先单击选中一张图片，再点裁剪'); return; }
      var oldSrc = imgNode.src;
      openModal(
        '<h3>裁剪图片</h3>'
        + '<div class="crop-box"><img id="crop-img" src="' + esc(oldSrc) + '" alt=""></div>'
        + '<div class="mrow note">拖动选区调整裁剪范围，确定后替换为裁剪结果</div>'
        + '<div class="mbtn-row"><button class="mbtn mbtn-cancel" id="crop-cancel">取消</button><button class="mbtn mbtn-ok" id="crop-ok">确定裁剪</button></div>'
      );
      document.getElementById('crop-cancel').onclick = closeModal;
      var img = document.getElementById('crop-img');
      var cropper = null, cropperReady = false;
      img.onload = function(){
        cropper = new Cropper(img, {
          viewMode: 1, autoCropArea: 0.8, background: false,
          ready: function(){ cropperReady = true; }
        });
      };
      if (img.complete) img.onload();
      document.getElementById('crop-ok').onclick = function(){
        if (!cropper || !cropperReady){ toast('图片正在初始化，请稍候再点确定'); return; }
        var canvas = null, failReason = '';
        try { canvas = cropper.getCroppedCanvas({ maxWidth: 4000, maxHeight: 4000 }); } catch(e){ failReason = '裁剪组件异常: ' + e.message; }
        if (!canvas && !failReason) failReason = '裁剪画布未就绪';
        if (!canvas){
          // 兜底：getCroppedCanvas 内部异常时，用 getData 手动绘制裁剪结果（不依赖 Cropper 内部画布）
          try {
            var d = cropper.getData();
            if (d && d.width > 0 && d.height > 0 && img.naturalWidth){
              var c = document.createElement('canvas');
              var s = Math.min(1, 4000 / Math.max(d.width, d.height));
              c.width = Math.max(1, Math.round(d.width * s));
              c.height = Math.max(1, Math.round(d.height * s));
              var ctx = c.getContext('2d');
              ctx.drawImage(img, d.x, d.y, d.width, d.height, 0, 0, c.width, c.height);
              canvas = c;
              failReason = '';
            } else {
              failReason = '选区数据无效（width=' + (d && d.width) + ', naturalWidth=' + img.naturalWidth + '）';
            }
          } catch(e2){ failReason = '手动绘制失败: ' + e2.message; }
        }
        if (!canvas){
          // 终极兜底：裁剪组件异常时直接用原图（不裁剪），保证功能可用
          toast('裁剪不可用（' + failReason + '），将直接使用原图');
          try {
            fetch(oldSrc).then(function(r){ return r.blob(); }).then(function(blob){
              var fd = new FormData();
              fd.append('file', blob, 'original.png');
              fetch('/api/upload', { method: 'POST', body: fd }).then(function(r){ return r.json(); }).then(function(res){
                if (res.errno !== 0){ toast('原图上传失败'); return; }
                var html = ed.getHtml();
                var div = document.createElement('div');
                div.innerHTML = html;
                var replaced = false;
                Array.prototype.forEach.call(div.querySelectorAll('img'), function(im){
                  if (im.getAttribute('src') === oldSrc){ im.setAttribute('src', res.data.url); replaced = true; }
                });
                if (replaced){ setHtmlSafe(ed, div.innerHTML); toast('已替换图片'); }
                closeModal();
              });
            });
          } catch(e3){ toast('原图上传失败: ' + e3.message); }
          return;
        }
        canvas.toBlob(function(blob){
          if (!blob){ toast('裁剪失败'); return; }
          var fd = new FormData();
          fd.append('file', blob, 'crop.png');
          fetch('/api/upload', { method: 'POST', body: fd }).then(function(r){ return r.json(); }).then(function(res){
            if (res.errno !== 0){ toast('上传失败'); return; }
            // CDN 版无 updateNode：用 getHtml → DOM 副本替换 src → setHtml
            var html = ed.getHtml();
            var div = document.createElement('div');
            div.innerHTML = html;
            var replaced = false;
            Array.prototype.forEach.call(div.querySelectorAll('img'), function(im){
              if (im.getAttribute('src') === oldSrc){ im.setAttribute('src', res.data.url); replaced = true; }
            });
            if (replaced){
              setHtmlSafe(ed, div.innerHTML);
              toast('已替换为裁剪后的图片');
            } else {
              toast('未找到原图片，请重新操作');
            }
            closeModal();
          });
        }, 'image/png');
      };
    };

    /* 自定义菜单：边框（图片/表格） */
    function BorderMenu(){
      this.title = '边框';
      this.tag = 'select';
      this.width = 80;
      this.iconSvg = ICON.border;
      this.selectList = [
        { text: '无边框', value: 'none' },
        { text: '细 1px', value: '1px' },
        { text: '中 2px', value: '2px' },
        { text: '粗 4px', value: '4px' },
        { text: '自定义…', value: 'custom' }
      ];
    }
    BorderMenu.prototype.getOptions = function(editor){ return this.selectList; };  // select 菜单必需，缺它会导致工具栏状态刷新报错
    BorderMenu.prototype.getValue = function(ed){
      // 必须在任何选区状态下都不抛错（工具栏状态更新会频繁调用）
      try {
        var n = getSelectedNode(ed, ['image', 'table']);
        if (n && n.style && n.style.border && n.style.border !== 'none') return n.style.border.split(' ')[0];
      } catch(e){}
      return 'none';
    };
    BorderMenu.prototype.isActive = function(){ return false; };
    BorderMenu.prototype.isDisabled = function(){ return false; };
    // 在 getHtml 的 DOM 副本中定位并修改目标元素样式，再 setHtml 同步回编辑器
    // targetNode: 选中的节点（type / src），DOM 副本按特征匹配
    function applyBorderStyle(ed, targetNode, width){
      var targetType = targetNode ? targetNode.type : '';
      var matchKey = null;
      if (targetType === 'image'){
        var s = window.getSelection();
        try {
          if (s && s.rangeCount > 0){
            var r = s.getRangeAt(0);
            var el = r.startContainer;
            if (el.nodeType === 3) el = el.parentNode;
            while (el && el !== document.body){
              if (el.tagName === 'IMG'){ matchKey = el.getAttribute('src'); break; }
              el = el.parentNode;
            }
          }
        } catch(e){}
        if (!matchKey && targetNode.src) matchKey = targetNode.src;
      } else {
        matchKey = 'TABLE'; // 表格：作用到文档中第一个表格（编辑区表格通常唯一）
      }
      if (!matchKey) return '未定位到选中的图片/表格，请单击选中后再试';
      var html = ed.getHtml();
      var div = document.createElement('div');
      div.innerHTML = html;
      var found = false;
      var selector = targetType === 'image' ? 'img' : 'table';
      Array.prototype.forEach.call(div.querySelectorAll(selector), function(el){
        var key = targetType === 'image' ? el.getAttribute('src') : 'TABLE';
        if (key !== matchKey) return;
        if (width){
          el.style.border = width + ' solid #9fb3c8';
          el.style.borderRadius = '10px';
          el.style.boxShadow = '0 2px 10px rgba(31,45,58,.18)';
          if (targetType === 'image'){ el.style.padding = '4px'; }
          else { el.style.borderCollapse = 'separate'; el.style.overflow = 'hidden'; }
        } else {
          el.style.border = '';
          el.style.borderRadius = '';
          el.style.boxShadow = '';
          el.style.padding = '';
          el.style.borderCollapse = '';
          el.style.overflow = '';
        }
        found = true;
        if (targetType !== 'image') return false; // 表格只处理第一个
      });
      if (!found) return '未定位到选中的元素';
      // 先清洗内容（解包嵌套表格/清孤立空白），再做嵌套检测；
      // 若仍含嵌套表格，setHtml 会崩（Cannot find a descendant）：改为直接作用到编辑区真实 DOM
      div.innerHTML = sanitizeContent(div.innerHTML);
      if (targetType !== 'image' && div.querySelector('table table')){
        var realTable = document.querySelector('#editor-container table');
        if (realTable){
          if (width){
            realTable.style.border = width + ' solid #9fb3c8';
            realTable.style.borderRadius = '10px';
            realTable.style.boxShadow = '0 2px 10px rgba(31,45,58,.18)';
            realTable.style.borderCollapse = 'separate';
            realTable.style.overflow = 'hidden';
          } else {
            realTable.style.border = ''; realTable.style.borderRadius = ''; realTable.style.boxShadow = '';
            realTable.style.borderCollapse = ''; realTable.style.overflow = '';
          }
          return width ? '已设置边框（注：文档含嵌套表格，样式保存后可能不保留，建议整理表格结构）'
                       : '已移除边框（注：文档含嵌套表格）';
        }
      }
      setHtmlSafe(ed, div.innerHTML);
      return width ? '已设置边框 ' + width + '（圆角）' : '已移除边框';
    }
    BorderMenu.prototype.exec = function(ed, value){
      var targetNode = getSelectedNode(ed, ['image', 'table']);
      if (!targetNode){ toast('请先单击选中图片或表格'); return; }
      var width = null;
      if (value === 'custom'){
        var v = window.prompt('请输入边框宽度（px）：', '2');
        if (v === null) return;
        width = v + 'px';
      } else if (value !== 'none') {
        width = value;
      }
      var msg = applyBorderStyle(ed, targetNode, width);
      toast(msg);
    };

    /* 自定义菜单：插入链接框（卡片：标题+介绍+打开链接）。
       用 h2/h3/h5 区分 大/中/小 规格；卡片由 标题块+介绍段+打开链接段 组成，
       这是 wangEditor 往返（保存/重开）能完整保留的最小结构（实测验证）。 */
    function CardMenu(){
      this.title = '插入链接框';
      this.tag = 'select';
      this.width = 120;
      // 不设置 iconSvg：select 菜单按钮显示的是"当前选中项"的文字，
      // 因此第一项用 value='' 作标签项，让按钮固定显示"插入链接框"＋下拉箭头
      this.selectList = [
        { text: '插入链接框', value: '', styleForRenderMenuList: { 'font-weight': '600', color: '#0d4a63' } },
        { text: '大号链接框', value: 'lg' },
        { text: '中号链接框', value: 'md' },
        { text: '小号链接框', value: 'sm' }

    CardMenu.prototype.getOptions = function(editor){ return this.selectList; };

    CardMenu.prototype.isActive = function(){ return false; };
    CardMenu.prototype.isDisabled = function(){ return false; };
    CardMenu.prototype.exec = function(ed, value){

      var blockHtml = '<' + tag + '>🖥 标题</' + tag + '>'
        + '<p>介绍文字</p>'
        + '<p><a href="#" data-action="打开" target="_blank">打开 →</a></p>';

        insertCardBlock(blockHtml, { action: '打开', effects: [] });

      } catch(e){ toast('插入失败: ' + e.message); }
    };

        + '<div class="mrow"><label>视频地址（mp4/webm 直链，或 B 站视频页地址）</label><input type="text" id="vdo-src" placeholder="https://.../movie.mp4 或 https://www.bilibili.com/video/BV..."></div>'
        + '<div class="mrow"><label>封面图片地址（可留空，B站视频不用填）</label><input type="text" id="vdo-poster" placeholder="https://.../cover.jpg"></div>'
        + '<div class="mrow note">本地视频：先在左侧「上传附件」传视频（可放到 videos 文件夹）；B站视频：直接粘贴视频页地址，自动转为嵌入播放器</div>'
        + '<div class="mbtn-row"><button class="mbtn mbtn-cancel" id="vdo-cancel">取消</button><button class="mbtn mbtn-ok" id="vdo-ok">确定</button></div>'
      );
      Array.prototype.forEach.call(document.querySelectorAll('#modal-box input, #modal-box select, #modal-box button'), function(el){
        el.addEventListener('mousedown', function(ev){ ev.stopPropagation(); });

      document.getElementById('vdo-local').onchange = function(){
        if (this.value) document.getElementById('vdo-src').value = this.value;

      document.getElementById('vdo-cancel').onclick = closeModal;
      document.getElementById('vdo-ok').onclick = function(){
        var src = document.getElementById('vdo-src').value.trim();
        var poster = document.getElementById('vdo-poster').value.trim();
        if (!src){ toast('请输入视频地址'); return; }
        closeModal();

          if (bv){
            // B 站视频页不是直链，<video> 播不了，必须用官方 iframe 播放器嵌入
            var player = 'https://player.bilibili.com/player.html?bvid=' + bv[1] + '&autoplay=0';
            insertBlockAtCursor('<div data-w-e-type="video" data-w-e-is-void><iframe src="' + esc(player) + '" frameborder="no" scrolling="no" allowfullscreen="true"></iframe></div>');
          } else {
            insertBlockAtCursor('<video src="' + esc(src) + '"' + (poster ? ' poster="' + esc(poster) + '"' : '')
              + ' controls preload="metadata"></video>');
            pageVideos.push({ src: src, poster: poster });

    /* 自定义菜单：插入音乐（单个音频→播放器；扫描文件夹→播放列表；前台按扩展名渲染） */
    function AudioMenu(){
      this.title = '插入音乐';
      this.tag = 'button';
      this.iconSvg = ICON.audio;
    }
    AudioMenu.prototype.getValue = function(){ return ''; };
    AudioMenu.prototype.isActive = function(){ return false; };
    AudioMenu.prototype.isDisabled = function(){ return false; };
    AudioMenu.prototype.exec = function(ed){
      var savedSel = null;
      try { savedSel = ed.selection ? JSON.parse(JSON.stringify(ed.selection)) : null; } catch(e){}
      // 同 LinkMenu：先主动失焦清选区，避免弹窗输入框光标被编辑器 onChange 抢走
      try { ed.blur(); } catch(e){}
      try { if (ed.selection) ed.selection = null; } catch(e){}
      var AUDIO_EXT = /\.(mp3|m4a|ogg|oga|wav|flac|aac)(\?|#|$)/i;
      var afiles = allNodes.filter(function(n){ return n.type === 'file' && AUDIO_EXT.test(n.content || ''); });
      var folders = allNodes.filter(function(n){ return n.type === 'folder'; });
      var aopts = afiles.map(function(f){
        return '<option value="' + esc(f.content) + '" data-title="' + esc(f.title) + '">' + esc(f.title) + '</option>';
      }).join('');
      var fopts = folders.map(function(f){
        var cnt = allNodes.filter(function(n){ return n.parent === f.id && n.type === 'file' && AUDIO_EXT.test(n.content || ''); }).length;
        return '<option value="' + f.id + '">' + esc(f.title) + '（' + cnt + ' 首）</option>';
      }).join('');
      openModal(
        '<h3>插入音乐</h3>'
        + '<div class="mrow"><label>本地音乐（从已上传附件中选择，自动填充）</label><select id="au-file"><option value="">— 不选，手动填地址 —</option>' + aopts + '</select></div>'
        + '<div class="mrow"><label>音乐地址</label><input type="text" id="au-src" placeholder="/files/xxx.mp3 或 https://.../xx.mp3"></div>'
        + '<div class="mrow"><label>显示标题（留空用文件名）</label><input type="text" id="au-title" placeholder="歌曲名"></div>'

        + '<div class="mrow" style="border-top:1px dashed #e3e9f0;padding-top:14px;margin-top:16px"><label>批量：扫描文件夹内全部音乐，生成播放列表</label><select id="au-folder"><option value="">— 选择文件夹 —</option>' + fopts + '</select></div>'
        + '<div class="mbtn-row"><button class="mbtn mbtn-ok" id="au-scan" style="margin-left:auto">扫描并生成播放列表</button></div>'
        + '<div class="mrow note">音乐在网页中显示为播放器；连续多首自动合并为播放列表。之后可像普通文字一样手动增删、调整顺序</div>'
      );

          if (t && !document.getElementById('au-title').value) document.getElementById('au-title').value = t;

      document.getElementById('au-cancel').onclick = closeModal;
      function insertAudios(list){
        if (!list.length){ toast('没有可插入的音乐'); return; }

        try { if (savedSel && savedSel.anchor && savedSel.anchor.path) ed.selection = savedSel; } catch(e){}
        // 存为普通链接段落（🎵 前缀），wangEditor 能完整保留；前台按扩展名识别并渲染为播放器
        var html = list.map(function(it){
          return '<p><a href="' + esc(it.url) + '">🎵 ' + esc(it.title) + '</a></p>';

          toast('已插入 ' + list.length + ' 首音乐');

        var title = document.getElementById('au-title').value.trim();
        if (!src){ toast('请选择或填写音乐地址'); return; }
        if (!title){ try { title = decodeURIComponent(src.split('/').pop().split('?')[0]); } catch(e){ title = src.split('/').pop(); } }

        if (!list.length){ toast('该文件夹里没有音乐文件（需先在左侧上传附件到该文件夹）'); return; }

    initClickTracking(editor);   // 记录点击选中的图片/表格，供裁剪/边框菜单定位
    E.createToolbar({
      editor: editor,
      selector: '#toolbar-container',
      config: {
        toolbarKeys: [
          'headerSelect', 'fontSize', 'bold', 'underline', 'italic', 'through',
          'color', 'bgColor',
          'bulletedList', 'numberedList', 'todo',
          'indent', 'lineHeight',
          'blockquote', 'codeBlock',
          'divider',
          'menuLink',
          'menuCard',
          'menuText',
          'menuVideo',
          'menuAudio',
          'menuIcon',
          'uploadImage', 'menuNetImg',
          'clearStyle',
          'undo', 'redo'
        ]
      },
      mode: 'default'
    });

    /* ---- 编辑区链接框所见即所得 cardify ----
       在编辑器 DOM 内把 h2/h3/h5 + p(介绍) + p(链接) 识别并包装成卡片。
       先用 debounce 避免 onChange 风暴；编辑时 cardify 可能破坏 wangEditor 内部的选区/光标位置，
       所以用一个标记 isTyping 来区分"用户正在输入"和"选中节点/操作菜单"场景。
       实际上这里只是加 wrapper div 并把结构搬进去，对编辑器的影响可控。 */
    var isCardifying = false;
    // wangEditor 把可编辑区域渲染在 #editor-container 内部的多层容器里，
    // 真正的块级子节点（h3/p）挂在 contenteditable 元素下，必须从这里取
    function getEditableBox(){
      var box = document.getElementById('editor-container');
      if (!box) return null;
      return box.querySelector('[contenteditable="true"]') || box.querySelector('[data-slate-editor]');
    }
    function unCardifyEditor(){
      // 把已有的 lnk-grid / lnk-card wrapper 拆掉，内容恢复为原始 h2/h3/h5 + p + p 结构
      var el = getEditableBox();
      if (!el) return;
      var wrappers = el.querySelectorAll('.lnk-grid, .lnk-card');
      for (var wi = wrappers.length - 1; wi >= 0; wi--){
        var w = wrappers[wi];
        var parent = w.parentNode;
        while (w.firstChild) parent.insertBefore(w.firstChild, w);
        w.parentNode.removeChild(w);
      }
    }
    uncardifyEditor = unCardifyEditor;
    cardifyEditor = function(){
      if (isCardifying) return; // 防止 setHtmlSafe 里的 cardify 递归触发 onChange
      var el = getEditableBox();
      if (!el) return;
      isCardifying = true;
      unCardifyEditor();
      var kids = Array.prototype.slice.call(el.children);
      var items = [];
      var i = 0;
      while (i < kids.length){
        var node = kids[i];
        if (/^H[235]$/.test(node.tagName)){
          var s1 = node.nextElementSibling, s2 = s1 && s1.nextElementSibling;
          if (s1 && s1.tagName === 'P' && s2 && s2.tagName === 'P' && s2.querySelector('a')){
            items.push({ h: node, s1: s1, s2: s2, size: node.tagName });
            i += 3;
            continue;
          }
        }
        if (node.tagName === 'P' && (node.innerHTML === '<br>' || (node.textContent || '').trim() === '')){ i++; continue; }
        items.push(null);
        i++;
      }
      var groups = [], cur = null;
      items.forEach(function(it){
        if (!it){ cur = null; return; }
        if (!cur || cur.size !== it.size){ cur = { size: it.size, items: [it] }; groups.push(cur); }
        else { cur.items.push(it); }
      });
      var seq = 0; // 卡片序号（与 pageCards / 保存顺序一致）
      function wrapCard(it, size, grid){
        var w = document.createElement('div');
        var st = pageCards[seq];
        var effects = (st && st.effects) ? st.effects : [];
        var fxCls = effects.length ? ' ' + effects.map(function(e){ return 'lnk-effect-' + e; }).join(' ') : ' lnk-effect-none';
        w.className = 'lnk-card ' + size + fxCls;
        w.setAttribute('data-card', seq);
        w.setAttribute('data-card-action', (st && st.action) ? st.action : '');
        seq++;
        it.h.parentNode.insertBefore(w, it.h);
        w.appendChild(it.h); w.appendChild(it.s1); w.appendChild(it.s2);
        if (grid) grid.appendChild(w);
        return w;
      }
      groups.forEach(function(g){
        if (g.size === 'H2'){ g.items.forEach(function(it){ wrapCard(it, 'lg', null); }); return; }
        var size = g.size === 'H5' ? 'sm' : 'md';
        var grid = document.createElement('div');
        grid.className = 'lnk-grid ' + size;
        g.items[0].h.parentNode.insertBefore(grid, g.items[0].h);
        g.items.forEach(function(it){ wrapCard(it, size, grid); });
      });
      decorateBlocks();
      isCardifying = false;
    };
    // 编辑器重渲染会丢掉 video 的 poster，按文档顺序从 pageVideos 真源补回封面
    function decorateBlocks(){
      var el = getEditableBox();
      if (!el) return;
      Array.prototype.forEach.call(el.querySelectorAll('video'), function(v, i){
        var st = pageVideos[i];
        if (st && st.poster && !v.getAttribute('poster')) v.setAttribute('poster', st.poster);
      });
    }

    /* ============ 链接框卡片：光标处插入 / 移动 / 右键菜单 ============ */
    var CARD_MARK = '\u2063cmk\u2063';
    var cardClipboard = null;

    // 从 HTML 里按文档顺序取出所有卡片三连（h2/h3/h5 + p + p(a)）
    function cardsInHtml(root){
      var out = [];
      var hs = root.querySelectorAll('h2,h3,h5');
      for (var i = 0; i < hs.length; i++){
        var h = hs[i], p1 = h.nextElementSibling, p2 = p1 && p1.nextElementSibling;
        if (p1 && p1.tagName === 'P' && p2 && p2.tagName === 'P' && p2.querySelector('a')) out.push({ h: h, p1: p1, p2: p2 });
      }
      return out;
    }
    function stripMarkText(root, mark){
      var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null, false);
      var list = [];
      while (walker.nextNode()) list.push(walker.currentNode);
      for (var i = 0; i < list.length; i++){
        var t = list[i];
        if (t.nodeValue && t.nodeValue.indexOf(mark) >= 0) t.nodeValue = t.nodeValue.split(mark).join('');
      }
    }
    // HTML 副本里包含标记文本的最外层块（root 的直接子节点）
    function blockOfMark(root, mark){
      var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null, false);
      while (walker.nextNode()){
        var t = walker.currentNode;
        if (t.nodeValue && t.nodeValue.indexOf(mark) >= 0){
          var cur = t;
          while (cur.parentNode && cur.parentNode !== root) cur = cur.parentNode;
          return cur.parentNode === root ? cur : null;
        }
      }
      return null;
    }
    // 兜底：从 DOM 选区取光标所在顶层块（工具栏菜单点击后 window.getSelection 可能已不在编辑区）
    function blockAtSelection(){
      var el = getEditableBox();
      if (!el) return null;
      var node = null;
      try {
        var sel = window.getSelection();
        node = sel && sel.anchorNode;
        if (node && !el.contains(node)) node = null;
      } catch(e){}
      if (!node) return null;
      var card = node.closest ? node.closest('.lnk-card') : null;
      if (card) return card.lastElementChild;
      var cur = node;
      while (cur && cur !== el){ if (cur.parentNode === el) break; cur = cur.parentNode; }
      if (cur && cur !== el && cur.nodeType === 1 && !(cur.classList && cur.classList.contains('lnk-grid'))) return cur;
      return null;
    }
    function cardEffectsOf(w){
      var eff = [];
      Array.prototype.forEach.call(w.classList, function(c){
        if (c.indexOf('lnk-effect-') === 0 && c !== 'lnk-effect-none') eff.push(c.slice('lnk-effect-'.length));
      });
      return eff;
    }
    // 把光标放到第 idx 张卡片后面；优先用卡片后面的空段落，没有则落到文档末尾的空段落
    function placeCursorAfterCard(idx){
      var el = getEditableBox();
      if (!el) return;
      var w = el.querySelectorAll('.lnk-card')[idx];
      if (!w) return;
      var node = (w.parentNode && w.parentNode.classList && w.parentNode.classList.contains('lnk-grid')) ? w.parentNode : w;
      var next = node.nextElementSibling;
      if (!isEmptyPara(next)){
        // 卡片后面没有空段落（紧跟其他内容），用文档末尾的空段落停靠
        next = el.lastElementChild;
        if (!isEmptyPara(next)) return;
      }
      try {
        editor.focus();
        var r = document.createRange();
        r.setStart(next, 0);
        r.collapse(true);
        var sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(r);
      } catch(e){}
    }
    /* 在光标所在块之后插入一段卡片 HTML（blockHtml 不带尾部空段落，由 sanitizeContent 统一管理空行）。
       插谁的问题：点击工具栏菜单时 window.getSelection 往往已经离开编辑区，
       所以优先用 editor.insertText 在 wangEditor 模型里打一个不可见标记 —— 模型里的位置是可靠的，
       再从 editor.getHtml() 里找到这个标记所在块，插到它后面。 */
    function insertCardBlock(blockHtml, meta){
      meta = meta || {};
      var el = getEditableBox();
      if (!el) return -1;
      var root = document.createElement('div');
      var anchor = null;
      // 方案 A：往模型里写标记，再按标记定位
      try {
        editor.insertText(CARD_MARK);
        root.innerHTML = editor.getHtml();
        var blk = blockOfMark(root, CARD_MARK);
        if (blk){
          stripMarkText(root, CARD_MARK);
          anchor = blk;
        } else {
          root.innerHTML = editor.getHtml();
        }
      } catch(e0){
        root.innerHTML = editor.getHtml();
      }
      // 方案 B：仍在编辑区里的真实 DOM 选区（按索引 + 标签/文本校验对齐）
      if (!anchor){
        var anchorEl = blockAtSelection();
        if (anchorEl){
          var kids = Array.prototype.slice.call(el.children);
          var pos = kids.indexOf(anchorEl);
          if (pos >= 0 && pos < root.children.length){
            var cand = root.children[pos];
            var ta = (anchorEl.textContent || '').trim().slice(0, 12);
            var tb = (cand.textContent || '').trim().slice(0, 12);
            if (cand.tagName === anchorEl.tagName && ta === tb) anchor = cand;
          }
        }
      }

      if (anchor){
        var pre = cardsInHtml(root);
        for (var i = 0; i < pre.length; i++){
          if (pre[i].h === anchor || pre[i].p1 === anchor || pre[i].p2 === anchor){ anchor = pre[i].p2; break; }
        }
      }
      if (anchor){
        if (!anchor.textContent.trim() && !anchor.querySelector('img,video,table,hr')) anchor.innerHTML = '<br>';
        anchor.insertAdjacentHTML('afterend', blockHtml);
      } else {
        root.insertAdjacentHTML('beforeend', blockHtml);

      var newIdx = -1;
      if (anchor){

      }
