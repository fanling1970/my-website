      if (newIdx >= 0) pageCards.splice(newIdx, 0, { action: meta.action || '打开', effects: meta.effects || [] });
      applyHtmlThen(root.innerHTML, newIdx);
      return newIdx;
    }
    // 通用：把一段 HTML 块插入到光标所在块之后（文本框 / 视频用）
    function insertBlockAtCursor(blockHtml){
      var el = getEditableBox();
      if (!el) return false;
      var root = document.createElement('div');
      var anchor = null;
      try {
        editor.insertText(CARD_MARK);
        root.innerHTML = editor.getHtml();
        var blk = blockOfMark(root, CARD_MARK);
        if (blk){ stripMarkText(root, CARD_MARK); anchor = blk; }
        else root.innerHTML = editor.getHtml();
      } catch(e0){ root.innerHTML = editor.getHtml(); }
      if (!anchor){
        var anchorEl = blockAtSelection();
        if (anchorEl){
          var kids = Array.prototype.slice.call(el.children);
          var pos = kids.indexOf(anchorEl);
          if (pos >= 0 && pos < root.children.length){
            var cand = root.children[pos];
            if (cand.tagName === anchorEl.tagName
              && (cand.textContent || '').trim().slice(0, 12) === (anchorEl.textContent || '').trim().slice(0, 12)) anchor = cand;
          }
        }
      }
      if (anchor){
        var pre = cardsInHtml(root);
        for (var i = 0; i < pre.length; i++){
          if (pre[i].h === anchor || pre[i].p1 === anchor || pre[i].p2 === anchor){ anchor = pre[i].p2; break; }
        }
        if (!anchor.textContent.trim() && !anchor.querySelector('img,video,table,hr,pre')) anchor.innerHTML = '<br>';
        anchor.insertAdjacentHTML('afterend', blockHtml);
      } else {
        root.insertAdjacentHTML('beforeend', blockHtml);
      }
      applyHtmlThen(root.innerHTML, -1);
      return true;
    }
    function rebuildCards(html, selIdx){ applyHtmlThen(html, selIdx); }
    function titlesOf(rootEl, sel){
      if (!rootEl) return '';
      return Array.prototype.map.call(rootEl.querySelectorAll(sel), function(e){ return e.textContent.trim().slice(0, 8); }).join('|');
    }
    // wangEditor 的 setHtml 只同步更新模型，DOM 重绘是异步的、有时甚至不重绘；
    // 这里设置后校验，必要时清空再重设来强制重绘，等 DOM 与目标一致后再 cardify／定位光标
    //（过早执行会作用在旧结构上，表现就是"下移了但界面没变"）
    function applyHtmlThen(html, selIdx){
      var d = document.createElement('div');
      d.innerHTML = html || '';
      var exp = titlesOf(d, 'h2,h3,h5');
      setHtmlSafe(editor, html);
      var tries = 0;
      (function check(){
        if (titlesOf(getEditableBox(), 'h2,h3,h5') === exp){
          cardifyEditor();
          if (typeof selIdx === 'number' && selIdx >= 0) placeCursorAfterCard(selIdx);
          return;
        }
        if (tries === 2){
          setHtmlSafe(editor, '<p><br></p>');
          setHtmlSafe(editor, html);
        }
        if (tries < 12){ tries++; setTimeout(check, 40); return; }
        cardifyEditor();
        if (typeof selIdx === 'number' && selIdx >= 0) placeCursorAfterCard(selIdx);
      })();
    }
    function isBlankBlock(el){
      return !!(el && el.nodeType === 1 && el.tagName === 'P'
        && !el.textContent.trim() && !el.querySelector('img,video,table,hr'));
    }
    // dir: -1 上移一个块位，1 下移一个块位（跳过空段落，避免"点了没反应"）
    function moveCardByDom(w, dir){
      var idx = parseInt(w.getAttribute('data-card'), 10);
      if (isNaN(idx)) return;
      var root = document.createElement('div');
      root.innerHTML = editor.getHtml();
      var cards = cardsInHtml(root);
      var cur = cards[idx];
      if (!cur) return;
      var p = cur.h.parentNode;
      var newIdx = idx;
      if (dir < 0){
        if (idx > 0){
          // 与上一张卡片交换
          var ref0 = cards[idx - 1].h;
          p.insertBefore(cur.h, ref0);
          p.insertBefore(cur.p1, ref0);
          p.insertBefore(cur.p2, ref0);
          var t = pageCards[idx - 1]; pageCards[idx - 1] = pageCards[idx]; pageCards[idx] = t;
          newIdx = idx - 1;
        } else {
          // 已是第一张卡：跳过上方空段落，移到上一个真实内容块之前
          var prev = cur.h.previousElementSibling;
          while (prev && isBlankBlock(prev)) prev = prev.previousElementSibling;
          if (!prev) return;
          p.insertBefore(cur.h, prev);
          p.insertBefore(cur.p1, prev);
          p.insertBefore(cur.p2, prev);
        }
      } else {
        if (idx + 1 < cards.length){
          // 与下一张卡片交换：插到下一张卡的三连之后
          var ref1 = cards[idx + 1].p2.nextElementSibling;
          p.insertBefore(cur.h, ref1);
          p.insertBefore(cur.p1, ref1);
          p.insertBefore(cur.p2, ref1);
          var t2 = pageCards[idx + 1]; pageCards[idx + 1] = pageCards[idx]; pageCards[idx] = t2;
          newIdx = idx + 1;
        } else {
          // 已是最后一张卡：跳过下方空段落，移到下一个真实内容块（如 my-panel）之后
          var nb = cur.p2.nextElementSibling;
          while (nb && isBlankBlock(nb)) nb = nb.nextElementSibling;
          if (!nb) return;
          var ref2 = nb.nextElementSibling;
          p.insertBefore(cur.h, ref2);
          p.insertBefore(cur.p1, ref2);
          p.insertBefore(cur.p2, ref2);
        }
      }
      rebuildCards(root.innerHTML, newIdx);
    }
    function deleteCardByDom(w){
      var idx = parseInt(w.getAttribute('data-card'), 10);
      if (isNaN(idx)) return;
      var root = document.createElement('div');
      root.innerHTML = editor.getHtml();
      var cur = cardsInHtml(root)[idx];
      if (!cur) return;
      cur.h.parentNode.removeChild(cur.h);
      cur.p1.parentNode.removeChild(cur.p1);
      cur.p2.parentNode.removeChild(cur.p2);
      if (idx < pageCards.length) pageCards.splice(idx, 1);
      rebuildCards(root.innerHTML, idx - 1);
    }
    function copyCardToClipboard(w){
      var idx = parseInt(w.getAttribute('data-card'), 10);
      if (isNaN(idx)) return false;
      var root = document.createElement('div');
      root.innerHTML = editor.getHtml();
      var cur = cardsInHtml(root)[idx];
      if (!cur) return false;
      var tag = cur.h.tagName.toLowerCase();
      cardClipboard = {
        html: '<' + tag + '>' + cur.h.innerHTML + '</' + tag + '>'
              + '<p>' + cur.p1.innerHTML + '</p>'
              + '<p>' + cur.p2.innerHTML + '</p>',
        action: w.getAttribute('data-card-action') || '打开',
        effects: cardEffectsOf(w)
      };
      return true;
    }
    // 卡片剪贴板为空时：尝试读取系统剪贴板（用户想"粘贴文档"的场景）
    function pasteSystemClipboard(){
      if (!navigator.clipboard || !navigator.clipboard.readText){
        toast('请用 Ctrl+V 粘贴内容'); return;
      }
      navigator.clipboard.readText().then(function(txt){
        if (!txt){ toast('剪贴板为空，请先复制文档内容'); return; }
        var html = txt.split(/\r?\n/).map(function(line){
          return '<p>' + (line.trim() ? esc(line) : '<br>') + '</p>';
        }).join('');
        insertBlockAtCursor(html);
        toast('已粘贴内容');
      }).catch(function(){ toast('无法读取剪贴板，请用 Ctrl+V 粘贴'); });
    }
    function pasteCardAtCursor(targetCardEl){
      if (!cardClipboard){ pasteSystemClipboard(); return; }
      var meta = { action: cardClipboard.action, effects: cardClipboard.effects };
      // 右键点在某张卡片上时，直接贴到该卡片后面（不依赖编辑器光标——右键菜单操作后光标常丢失）
      if (targetCardEl && targetCardEl.isConnected){
        var idx = parseInt(targetCardEl.getAttribute('data-card'), 10);
        if (!isNaN(idx)){
          var root = document.createElement('div');
          root.innerHTML = editor.getHtml();
          var cur = cardsInHtml(root)[idx];
          if (cur){
            cur.p2.insertAdjacentHTML('afterend', cardClipboard.html);
            pageCards.splice(idx + 1, 0, meta);
            applyHtmlThen(root.innerHTML, idx + 1);
            toast('已粘贴卡片');
            return;
          }
        }
      }
      // 右键点在空白处：回退到光标位置插入
      insertCardBlock(cardClipboard.html, meta);
      toast('已粘贴卡片');
    }
    /* ---- 卡片右键菜单 ---- */
    var ctxCardEl = null;
    var cardMenuEl = document.getElementById('card-menu');
    function showCardMenu(x, y, w){
      ctxCardEl = w;
      Array.prototype.forEach.call(cardMenuEl.querySelectorAll('a'), function(a){
        var needCard = a.getAttribute('data-op') !== 'paste';
        a.classList.toggle('disabled', needCard && !w);
      });
      cardMenuEl.classList.add('show');
      var pw = cardMenuEl.offsetWidth || 130, ph = cardMenuEl.offsetHeight || 240;
      cardMenuEl.style.left = Math.max(4, Math.min(x, window.innerWidth - pw - 8)) + 'px';
      cardMenuEl.style.top = Math.max(4, Math.min(y, window.innerHeight - ph - 8)) + 'px';
    }
    function hideCardMenu(){ cardMenuEl.classList.remove('show'); }
    function markActiveCard(w){
      Array.prototype.forEach.call(document.querySelectorAll('#editor-container .lnk-card.ctx-active'), function(c){ c.classList.remove('ctx-active'); });
      if (w) w.classList.add('ctx-active');
    }
    (function bindCardOps(){
      var el = getEditableBox();
      if (!el || el.__cardOpsBound) return;
      el.__cardOpsBound = true;
      el.addEventListener('contextmenu', function(ev){
        var w = ev.target.closest ? ev.target.closest('.lnk-card') : null;
        markActiveCard(w);
        // 只有右键点中卡片（或剪贴板里有已复制的卡片）时才接管菜单；
        // 其余情况放行浏览器原生菜单，保证"粘贴文档"等原生操作可用
        if (w || cardClipboard){
          ev.preventDefault();
          showCardMenu(ev.clientX, ev.clientY, w);
        }
      });
      el.addEventListener('click', function(ev){
        var w = ev.target.closest ? ev.target.closest('.lnk-card') : null;
        markActiveCard(w);
      });
      document.addEventListener('mousedown', function(ev){ hideCardMenu(); });
      cardMenuEl.addEventListener('mousedown', function(ev){ ev.stopPropagation(); });
      cardMenuEl.addEventListener('click', function(ev){
        var a = ev.target.closest ? ev.target.closest('a[data-op]') : null;
        if (!a) return;
        var op = a.getAttribute('data-op');
        var w = ctxCardEl;
        hideCardMenu();
        if (op === 'paste'){ pasteCardAtCursor(w); return; }
        if (!w || !w.isConnected){ toast('卡片已失效，请重新右键'); return; }
        if (op === 'up') moveCardByDom(w, -1);
        else if (op === 'down') moveCardByDom(w, 1);
        else if (op === 'copy'){ if (copyCardToClipboard(w)) toast('已复制卡片，在目标卡片上右键→粘贴'); }
        else if (op === 'cut'){ if (copyCardToClipboard(w)){ deleteCardByDom(w); toast('已剪切卡片，在目标卡片上右键→粘贴'); } }
        else if (op === 'edit'){ var h = w.querySelector('h2,h3,h5'); if (h) openCardEditor(editor, h); }
        else if (op === 'del'){ deleteCardByDom(w); toast('已删除卡片'); }
      });
    })();
    /* 文本框（pre 代码块）右上角悬浮"复制"按钮：不进入 contenteditable，避免污染保存内容 */
    (function bindPreCopy(){
      var el = getEditableBox();
      var btn = document.getElementById('pre-copy');
      if (!el || !btn || el.__preCopyBound) return;
      el.__preCopyBound = true;
      var curPre = null, hideTimer = null;
      function hideSoon(){ clearTimeout(hideTimer); hideTimer = setTimeout(function(){ btn.style.display = 'none'; }, 220); }
      function showBtn(pre){
        var r = pre.getBoundingClientRect();
        btn.style.left = Math.max(8, r.right - 64) + 'px';
        btn.style.top = (r.top + 8) + 'px';
        btn.style.display = 'block';
      }
      el.addEventListener('mousemove', function(ev){
        var pre = ev.target.closest ? ev.target.closest('pre') : null;
        curPre = pre;
        if (pre){ clearTimeout(hideTimer); showBtn(pre); }
        else hideSoon();
      });
      el.addEventListener('scroll', function(){ if (curPre) showBtn(curPre); else btn.style.display = 'none'; });
      el.addEventListener('mouseleave', hideSoon);
      btn.addEventListener('mouseenter', function(){ clearTimeout(hideTimer); });
      btn.addEventListener('mouseleave', hideSoon);
      btn.addEventListener('mousedown', function(ev){ ev.preventDefault(); ev.stopPropagation(); });
      btn.addEventListener('click', function(ev){
        ev.preventDefault(); ev.stopPropagation();
        if (!curPre) return;
        var text = curPre.textContent.replace(/\n+$/g, '');
        if (!text){ toast('文本框内容为空'); return; }
        if (navigator.clipboard && navigator.clipboard.writeText){
          navigator.clipboard.writeText(text).then(function(){ toast('已复制文本框内容'); })
            .catch(function(){ toast('复制失败，请手动选中复制'); });
        } else { toast('当前浏览器不支持自动复制'); }
      });
    })();
    var cardifyTimer = null;
    editor.on('change', function(){
      clearTimeout(cardifyTimer);
      cardifyTimer = setTimeout(cardifyEditor, 300);
    });
  }

  /* ============ 操作 ============ */
  function loadAll(){
    fetch('/api/nodes').then(function(r){ return r.json(); }).then(function(list){
      allNodes = list;
      renderTree();
    });
  }

  function currentParent(){
    var n = currentId ? findNode(currentId) : null;
    if (n && n.type === 'folder') return n.id;
    if (n) return n.parent;
    return '';
  }

  function createNode(type){
    var title = window.prompt(type==='folder' ? '文件夹名称：' : '页面标题：', type==='folder' ? '新文件夹' : '新页面');
    if (!title || !title.trim()) return;
    fetch('/api/nodes', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ type: type, parent: currentParent(), title: title.trim() })
    }).then(function(r){ return r.json(); }).then(function(n){
      if (n.error){ toast('创建失败: ' + n.error); return; }
      if (type === 'folder'){ expanded[n.id] = true; }
      loadAll();
      selectNode(n.id);
      toast('已创建');
    });
  }

  function saveNode(){
    var title = document.getElementById('title').value.trim();
    if (!title){ toast('请先填写标题'); return; }
    if (!currentId){ toast('请先选择或新建内容'); return; }
    var body = { title: title, hidden: document.getElementById('chk-hidden').checked };
    if (currentType === 'page'){
      var html = injectCardState(sanitizeContent(editor.getHtml()), currentCardState());
      body.content = injectVideoState(html, videosFromDom() || pageVideos);
    }
    fetch('/api/nodes/' + currentId, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    }).then(function(r){ return r.json(); }).then(function(n){
      if (n.error){ toast('保存失败: ' + n.error); return; }
      loadAll(); toast('已保存');
    });
  }

  function uploadAttachment(){
    var input = document.createElement('input');
    input.type = 'file';
    input.multiple = true;
    input.onchange = function(){
      if (!input.files || !input.files.length) return;
      var files = Array.prototype.slice.call(input.files);
      var ok = 0, fail = 0;
      // 串行上传：避免多个大文件并发占满带宽/内存导致请求中断
      (function next(i){
        if (i >= files.length){
          loadAll();
          if (fail) toast('上传完成：成功 ' + ok + ' 个，失败 ' + fail + ' 个');
          else toast(files.length > 1 ? ('已上传 ' + ok + ' 个附件') : '附件已上传');
          return;
        }
        var f = files[i];
        toast('上传中 ' + (i + 1) + '/' + files.length + '：' + f.name + '（' + Math.round(f.size / 1048576) + 'MB）');
        var fd = new FormData();
        fd.append('file', f);
        fetch('/api/upload', { method: 'POST', body: fd })
          .then(function(r){
            return r.json().catch(function(){ return { error: '服务器返回 HTTP ' + r.status }; });
          })
          .then(function(res){
            if (!res || res.errno !== 0){
              fail++;
              toast('「' + f.name + '」上传失败' + (res && res.error ? '：' + res.error : ''));
              return null;
            }
            return fetch('/api/nodes', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                type: 'file',
                parent: currentParent(),
                title: res.data.name,
                content: res.data.url,
                fileName: res.data.name,
                size: res.data.size
              })
            }).then(function(r2){ return r2.json(); }).then(function(n){
              if (!n || n.error){ fail++; toast('「' + f.name + '」登记失败'); }
              else { ok++; }
            });
          })
          .catch(function(e){ fail++; toast('「' + f.name + '」上传出错：' + e.message); })
          .then(function(){ next(i + 1); });
      })(0);
    };
    input.click();
  }

  document.getElementById('btn-new').onclick = function(){ createNode('page'); };
  document.getElementById('btn-folder').onclick = function(){ createNode('folder'); };
  document.getElementById('btn-upload').onclick = uploadAttachment;
  document.getElementById('btn-settings').onclick = openSettingsModal;
  document.getElementById('btn-logout').onclick = function(e){
    e.preventDefault();
    if (!confirm('确定退出登录吗？')){ return; }
    // 服务端清除会话 Cookie 后跳转首页；replace 替换当前后台页历史记录，
    // 后台页不进浏览器历史，退出后按后退只会回到首页
    location.replace('/logout');
  };
  document.getElementById('btn-save').onclick = saveNode;
  document.getElementById('btn-preview').onclick = function(){
    if (!currentId || currentType !== 'page'){ toast('请先选择页面'); return; }
    saveNode();
    setTimeout(function(){ window.open('/?p=' + currentId, '_blank'); }, 300);
  };
  document.getElementById('title').addEventListener('keydown', function(e){ if (e.key === 'Enter') saveNode(); });

  /* 会话校验：未登录跳转登录页（含浏览器后退从缓存恢复后台页面的场景） */
  function requireSession(){
    fetch('/api/session').then(function(r){
      if (r.status === 401){ location.replace('/login'); return null; }
      return r.json();
    });
  }
  requireSession();
  loadSettings();
  window.addEventListener('pageshow', function(e){ if (e.persisted) requireSession(); });

  loadAll();
})();
</script>
</body>
</html>
